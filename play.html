<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/png" href="assets/rv-icon.png">
  <link rel="apple-touch-icon" href="assets/rv-icon.png">
  <link rel="manifest" href="manifest.json">
  <!-- Boot rápido: abre a conexão com o CDN dos núcleos antes de o jogo pedir -->
  <link rel="preconnect" href="https://cdn.emulatorjs.org" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.emulatorjs.org">
  <title>RetroVerso - Jogando...</title>
  <!-- Defesa: o EmulatorJS consulta MediaRecorder.isTypeSupported SEM checar
       se a API existe. Em navegadores sem MediaRecorder (WebKit/Safari antigo,
       alguns WebViews e shells de PWA) a referência crua lançava ReferenceError
       e QUEBRAVA o boot: tela preta, controles aparentemente vivos, jogo morto
       ("toques recebidos, jogo não responde"). O stub só desativa a gravação. -->
  <script>
    if (typeof window.MediaRecorder === 'undefined') {
      window.MediaRecorder = function () { };
      window.MediaRecorder.isTypeSupported = function () { return false; };
    }
    window.addEventListener('error', function (e) {
      window.__rvLastError = String((e.error && e.error.message) || e.message || '');
    });
  </script>
  <script src="js/audio.js"></script>
  <script src="js/overlay-parser.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ═══ POSIÇÃO/TAMANHO DA TELA DO JOGO ═══
       Altere estas quatro variáveis para ajustar a imagem do jogo
       por baixo da moldura do overlay. O padrão ocupa a viewport inteira.
       Exemplo: top: 8vh; height: 42vh;
    ═══════════════════════════════════════════ */
    :root {
      --rv-game-left: 0px;
      --rv-game-top: 0px;
      --rv-game-width: 100vw;
      --rv-game-height: 100vh;
    }

    #game {
      position: fixed;
      left: var(--rv-game-left);
      top: var(--rv-game-top);
      width: var(--rv-game-width);
      height: var(--rv-game-height);
      z-index: 1;
      background: #000;
    }

    /* LOADING (personalizado por console) */
    #rv-loading {
      position: fixed; inset: 0; z-index: 9999;
      background: #030604;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      transition: opacity 0.9s ease, visibility 0.9s ease;
    }
    #rv-loading.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .rv-bg {
      position: absolute; inset: 0;
      background: radial-gradient(circle at 50% 40%, var(--rv-glow, rgba(0,255,65,.13)) 0%, transparent 65%), #030604;
    }
    .rv-bg::before {
      content: ''; position: absolute; inset: 0;
      background-image: repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(255,255,255,.02) 3px,rgba(255,255,255,.02) 4px);
      animation: scanPulse 4s linear infinite;
    }
    @keyframes scanPulse { 0%,100%{opacity:.5} 50%{opacity:1} }
    .rv-logo {
      position: relative; z-index: 1;
      width: 90px; height: 90px;
      border: 2.5px solid var(--rv-color, #00ff41); border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 2.2rem; font-weight: 900; color: var(--rv-color, #00ff41); letter-spacing: 2px;
      animation: logoPulse 2s ease-in-out infinite;
    }
    @keyframes logoPulse {
      0%,100%{ box-shadow: 0 0 20px var(--rv-glow, rgba(0,255,65,.6)), 0 0 60px var(--rv-glow, rgba(0,255,65,.2)), inset 0 0 20px var(--rv-glow, rgba(0,255,65,.08)); }
      50%    { box-shadow: 0 0 35px var(--rv-glow, rgba(0,255,65,.9)), 0 0 90px var(--rv-glow, rgba(0,255,65,.35)), inset 0 0 30px var(--rv-glow, rgba(0,255,65,.15)); }
    }
    .rv-console-title {
      position: relative; z-index: 1;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 1.4rem; font-weight: 900; letter-spacing: 4px;
      color: #fff;
      text-shadow: 0 0 16px var(--rv-glow, rgba(0,255,65,.7));
    }
    .rv-name { position: relative; z-index: 1; font-size: 2.2rem; font-weight: 900; letter-spacing: 8px; color: #fff; text-shadow: 0 0 20px rgba(0,255,65,.7); }
    .rv-slogan { position: relative; z-index: 1; font-size: .78rem; font-weight: 600; letter-spacing: 5px; color: var(--rv-color, #00ff41); }
    .rv-bar-wrap { position: relative; z-index: 1; width: 220px; height: 3px; background: rgba(255,255,255,.08); border-radius: 3px; overflow: hidden; margin-top: 10px; }
    .rv-bar { height: 100%; width: 40%; background: var(--rv-color, #00ff41); border-radius: 3px; box-shadow: 0 0 10px var(--rv-color, #00ff41); animation: barSweep 1.6s ease-in-out infinite; }
    @keyframes barSweep { 0%{transform:translateX(-100%)} 100%{transform:translateX(350%)} }
    .rv-msg { position: relative; z-index: 1; font-size: .72rem; letter-spacing: 3px; color: var(--rv-color, rgba(0,255,65,.5)); }

    #rv-download-progress { position: relative; z-index: 2; display: none; flex-direction: column; align-items: center; gap: 10px; width: 280px; }
    #rv-download-progress.visible { display: flex; }
    .rv-dl-title { font-size: 0.7rem; letter-spacing: 3px; color: rgba(0,255,65,0.7); text-transform: uppercase; }
    .rv-dl-bar-wrap { width: 100%; height: 4px; background: rgba(0,255,65,0.1); border-radius: 4px; overflow: hidden; }
    .rv-dl-bar-fill { height: 100%; width: 0%; background: #00ff41; border-radius: 4px; box-shadow: 0 0 10px #00ff41; transition: width 0.3s ease; }
    .rv-dl-info { font-size: 0.72rem; letter-spacing: 2px; color: rgba(255,255,255,0.5); }

    #rv-fs-btn {
      position: fixed; top: 10px; right: 10px; z-index: 8000;
      background: rgba(0,255,65,.12); border: 1px solid rgba(0,255,65,.4);
      border-radius: 8px; width: 38px; height: 38px;
      display: none; align-items: center; justify-content: center;
      cursor: pointer;
    }
    #rv-fs-btn.visible { display: flex; }
    #rv-fs-btn svg { width: 18px; height: 18px; fill: #00ff41; }

    /* ═══════════════════════════════════════════
       FLOATING BUTTONS (screenshot, theater, menu)
    ═══════════════════════════════════════════ */
    .rv-float-btns {
      position: fixed;
      top: 10px; right: 56px;
      z-index: 8000;
      display: none;
      gap: 8px;
    }
    .rv-float-btns.visible { display: flex; }

    .rv-float-btn {
      background: rgba(0,255,65,.12);
      border: 1px solid rgba(0,255,65,.4);
      border-radius: 8px;
      width: 38px; height: 38px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      position: relative;
    }
    .rv-float-btn:active { transform: scale(0.9); background: rgba(0,255,65,.3); }
    .rv-float-btn svg { width: 18px; height: 18px; fill: #00ff41; pointer-events: none; }

    /* Toast notification (screenshot salvo) */
    .rv-toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(0,0,0,0.9);
      border: 1px solid rgba(0,255,65,0.4);
      border-radius: 10px;
      padding: 10px 24px;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 0.8rem;
      color: #00ff41;
      letter-spacing: 1px;
      z-index: 9999;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .rv-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ═══ MENU DE CHEATS SOBRE TODOS OS CONTROLES ═══ */
    body.rv-cheats-open .ejs_popup_container {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 100000 !important;
      /* Deixa o botão MENU do overlay receber o segundo clique. */
      pointer-events: none !important;
    }

    /* Somente os controles da lista continuam interativos. */
    body.rv-cheats-open .ejs_popup_container .ejs_button,
    body.rv-cheats-open .ejs_popup_container .ejs_button_button,
    body.rv-cheats-open .ejs_popup_container .ejs_cheat_row,
    body.rv-cheats-open .ejs_popup_container .ejs_cheat_row *,
    body.rv-cheats-open .ejs_popup_container .ejs_cheat_parent,
    body.rv-cheats-open .ejs_popup_container .ejs_cheat_parent * {
      pointer-events: auto !important;
    }

    /* ═══════════════════════════════════════════
       THEATER MODE
       Modo imersivo: oculta a moldura/controles touch e deixa
       somente a tela do emulador ocupando a viewport.
    ═══════════════════════════════════════════ */
    body.theater-mode #game {
      left: 0 !important;
      top: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 10;
    }

    body.theater-mode #rv-overlay,
    body.theater-mode #rv-pad {
      display: none !important;
      pointer-events: none !important;
    }

    body.theater-mode #rv-fs-btn,
    body.theater-mode .rv-float-btns { opacity: 0.35; z-index: 8000; }
    body.theater-mode #rv-fs-btn:hover,
    body.theater-mode .rv-float-btns:hover { opacity: 1; }
    body.theater-mode #rv-theater-btn {
      border-color: #00ff41;
      box-shadow: 0 0 14px rgba(0,255,65,.45);
    }

    /* ═══════════════════════════════════════════
       OVERLAY SYSTEM
       Container posicionado no bottom com a imagem
       e zonas de toque transparentes por cima
    ═══════════════════════════════════════════ */
    #rv-overlay {
      position: fixed;
      bottom: 0; left: 0;
      z-index: 5000;
      pointer-events: none;
      display: none;
      overflow: visible;
      max-height: 100vh;
    }
    #rv-overlay.active { display: block; }

    /* Área transparente da tela inferior do Nintendo DS.
       Fica ACIMA do overlay (z 5000): o parser RetroArch usa hit-test de tela
       cheia no container (#rv-overlay pointer-events:auto), então a camada
       precisa estar acima para receber os toques da tela touch, que são
       encaminhados ao core do DeSmuME. Botões do overlay ficam fora dessa
       região (moldura/bisel), então não são bloqueados. */
    #rv-nds-stylus-layer {
      position: fixed;
      left: 0;
      right: 0;
      top: 50%;
      bottom: 0;
      z-index: 5010;
      display: none;
      pointer-events: auto;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      background: transparent;
    }
    #rv-nds-stylus-layer.active { display: block; }
    /* Teatro NÃO esconde a camada touch do NDS — ela segue a tela inferior
       em qualquer modo (sem ela, o teatro tornava NDS injogável). */
    body.rv-cheats-open #rv-nds-stylus-layer { display: none !important; }

    /* ═══ MINI-BARRA DE AÇÕES DE SISTEMA ═══
       Abre ao SEGURAR o botão MENU do overlay (~500ms); toque rápido = cheats.
       Ícones em SVG (padrão do projeto) — nada de emoji. */
    #rv-sys-bar {
      position: fixed;
      left: 50%;
      bottom: max(14px, env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%) translateY(16px);
      z-index: 6000;
      display: none;
      flex-direction: column;
      gap: 7px;
      width: min(92vw, 400px);
      padding: 10px;
      background: rgba(8, 12, 10, 0.92);
      border: 1px solid rgba(0, 255, 65, 0.45);
      border-radius: 14px;
      box-shadow: 0 6px 30px rgba(0, 0, 0, 0.6), 0 0 18px rgba(0, 255, 65, 0.18);
      backdrop-filter: blur(6px);
      opacity: 0;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }
    #rv-sys-bar.open { display: flex; opacity: 1; transform: translateX(-50%) translateY(0); }
    #rv-sys-bar .rv-sys-head {
      display: flex; align-items: baseline; gap: 8px;
      padding: 0 2px; min-width: 0;
    }
    #rv-sys-bar .rv-sys-game {
      flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      color: #d8ffe0; font-size: 12px; font-weight: 700; letter-spacing: 0.4px;
    }
    #rv-sys-bar .rv-sys-core { color: #00ff41; font-size: 10px; letter-spacing: 1px; flex-shrink: 0; }
    #rv-sys-bar .rv-sys-save-row {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 8px;
      background: rgba(0, 255, 65, 0.06);
      border: 1px solid rgba(0, 255, 65, 0.22);
      border-radius: 9px;
    }
    #rv-sys-bar .rv-sys-save-row svg { width: 14px; height: 14px; stroke: #00ff41; flex-shrink: 0; }
    #rv-sys-bar .rv-sys-save-info {
      flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      color: #bfe8c8; font-size: 11px;
    }
    #rv-sys-bar .rv-sys-actions { display: flex; gap: 6px; }
    #rv-sys-bar .rv-sys-actions button {
      flex: 1;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      min-width: 48px; padding: 7px 8px;
      background: rgba(0, 255, 65, 0.07);
      border: 1px solid rgba(0, 255, 65, 0.35);
      border-radius: 10px; color: #d8ffe0;
      font-family: inherit; font-size: 10px; letter-spacing: 0.4px;
      cursor: pointer; touch-action: manipulation;
    }
    #rv-sys-bar .rv-sys-actions button svg.ico { width: 18px; height: 18px; stroke: currentColor; }
    #rv-sys-bar button.rv-del {
      display: flex; align-items: center; justify-content: center;
      width: 26px; height: 26px; padding: 0;
      background: rgba(255, 60, 60, 0.10);
      border: 1px solid rgba(255, 90, 90, 0.45);
      border-radius: 7px; color: #ffb3b3;
      cursor: pointer; touch-action: manipulation; flex-shrink: 0;
    }
    #rv-sys-bar button.rv-del svg { width: 13px; height: 13px; stroke: currentColor; }
    #rv-sys-bar button:active { transform: scale(0.94); }
    #rv-sys-bar button.on {
      background: rgba(0, 255, 65, 0.28);
      box-shadow: 0 0 12px rgba(0, 255, 65, 0.5);
      color: #00ff41;
    }
    #rv-sys-bar .rv-sys-actions button.rv-dim { opacity: 0.35; }
    #rv-sys-bar .rv-sys-actions button.rv-close { flex: 0 0 auto; min-width: 0; }
    body.rv-cheats-open #rv-sys-bar { display: none !important; }
    /* Sprite SVG compartilhado (ícones de sistema) — invisível. */
    #rv-svg-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

    #rv-overlay img.rv-skin-img {
      display: block;
      width: 100%;
      height: auto;
      pointer-events: none;
    }

    /* Imagem animated (feedback de pressionar) */
    #rv-overlay img.rv-anim-img {
      position: absolute;
      bottom: 0; left: 0;
      width: 100%;
      height: auto;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.06s ease;
    }
    #rv-overlay img.rv-anim-img.show { opacity: 1; }

    /* Zonas de toque */
    .rv-zone {
      position: absolute;
      pointer-events: auto;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      z-index: 10;
      cursor: pointer;
    }
    .rv-zone.pressed { opacity: 0.7; }

    .rv-zone-dpad {
      border-radius: 50%;
    }

    /* ═══════════════════════════════════════════
       CONTROLES CSS FALLBACK (landscape/arcade)
    ═══════════════════════════════════════════ */
    #rv-pad { position: fixed; inset: 0; z-index: 5000; pointer-events: none; display: none; }
    #rv-pad.active { display: block; }
    .rv-btn {
      position: absolute; display: flex; align-items: center; justify-content: center;
      border-radius: 50%; font-weight: 900; line-height: 1;
      pointer-events: auto; cursor: pointer; touch-action: none;
      user-select: none; -webkit-user-select: none;
      transition: transform .07s ease, filter .07s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .rv-btn.pressed { transform: scale(.82) !important; filter: brightness(1.5) !important; }
    .rv-shoulder {
      position: absolute; display: flex; align-items: center; justify-content: center;
      border-radius: 14px; font-weight: 900; font-size: .75rem;
      letter-spacing: 1px; text-transform: uppercase;
      pointer-events: auto; cursor: pointer; touch-action: none;
      user-select: none; -webkit-user-select: none;
      transition: transform .07s ease, filter .07s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .rv-shoulder.pressed { transform: scale(.88) !important; filter: brightness(1.5) !important; }
    .rv-meta {
      position: absolute; display: flex; align-items: center; justify-content: center;
      border-radius: 20px; font-weight: 700; font-size: .55rem;
      letter-spacing: 1.5px; text-transform: uppercase;
      pointer-events: auto; cursor: pointer; touch-action: none;
      user-select: none; -webkit-user-select: none;
      transition: transform .07s ease, filter .07s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .rv-meta.pressed { transform: scale(.88) !important; filter: brightness(1.4) !important; }
    #rv-dpad { position: absolute; pointer-events: auto; touch-action: none; }
  </style>
</head>
<body>

<div id="rv-loading">
  <div class="rv-bg"></div>
  <div class="rv-logo">RV</div>
  <div class="rv-console-title" id="rv-console-title"></div>
  <div class="rv-name">RETROVERSO</div>
  <div class="rv-slogan">ENTER THE CLASSICS</div>
  <div class="rv-bar-wrap"><div class="rv-bar"></div></div>
  <div class="rv-msg" id="rv-msg">Carregando emulador...</div>
  <div id="rv-download-progress">
    <div class="rv-dl-title">⬇ BAIXANDO JOGO</div>
    <div class="rv-dl-bar-wrap"><div class="rv-dl-bar-fill" id="rv-dl-bar"></div></div>
    <div class="rv-dl-info" id="rv-dl-info">0 MB / ? MB</div>
  </div>
</div>

<div id="rv-fs-btn" title="Tela cheia">
  <svg viewBox="0 0 24 24"><path d="M3 3h6v2H5v4H3V3zm12 0h6v6h-2V5h-4V3zM3 15h2v4h4v2H3v-6zm16 4h-4v2h6v-6h-2v4z"/></svg>
</div>

<!-- BOTÕES FLUTUANTES (screenshot + theater) -->
<div class="rv-float-btns" id="rv-float-btns">
  <div class="rv-float-btn" id="rv-screenshot-btn" title="Screenshot">
    <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
  </div>
  <div class="rv-float-btn" id="rv-theater-btn" title="Modo Theater">
    <svg viewBox="0 0 24 24"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/></svg>
  </div>
</div>

<!-- TOAST NOTIFICATION -->
<div class="rv-toast" id="rv-toast"></div>

<div id="game"></div>
<div id="rv-overlay"></div>
<div id="rv-nds-stylus-layer" aria-label="Tela touch do Nintendo DS"></div>
<!-- Sprite de ícones SVG (padrão do projeto) -->
<svg id="rv-svg-sprite" aria-hidden="true" focusable="false">
  <symbol id="rv-i-save" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
    <polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
  </symbol>
  <symbol id="rv-i-load" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
    <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
  </symbol>
  <symbol id="rv-i-reset" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 2v6h-6"/><path d="M21 13a9 9 0 1 1-3-7.7L21 8"/>
  </symbol>
  <symbol id="rv-i-turbo" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="13 19 22 12 13 5 13 19"/><polygon points="2 19 11 12 2 5 2 19"/>
  </symbol>
  <symbol id="rv-i-exit" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
    <polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
  </symbol>
  <symbol id="rv-i-close" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
  </symbol>
  <symbol id="rv-i-trash" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="3 6 5 6 21 6"/>
    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>

const params = new URLSearchParams(window.location.search);
let core = params.get('core') || 'snes';
// Garante que 'game' não carregue query string embutida (ex: "...nes?debug=1")
// — remove qualquer '?' que apareça DENTRO do valor do game.
let game = (params.get('game') || '').split('?')[0];
if (core === 'mupen64plus' || core === 'mupen64plus_next') core = 'n64';
if (core === 'melonds' || core === 'desmume' || core === 'desmume2015') core = 'nds';

const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

/* ═══ Cores temáticas para loading screen ═══ */
const CONSOLE_THEMES = {
  snes:         { name: 'Super Nintendo',     color: '#7B2D8E', glow: 'rgba(123,45,142,0.5)' },
  nes:          { name: 'Nintendo Classic',   color: '#E4002B', glow: 'rgba(228,0,43,0.5)' },

  fbneo:        { name: 'Arcade',             color: '#00FF41', glow: 'rgba(0,255,65,0.5)' },
};

// Aplica cores temáticas na loading screen
(function applyConsoleTheme() {
  const theme = CONSOLE_THEMES[core] || { name: 'RetroVerso', color: '#00ff41', glow: 'rgba(0,255,65,0.5)' };
  const loading = document.getElementById('rv-loading');
  if (loading) {
    loading.style.setProperty('--rv-color', theme.color);
    loading.style.setProperty('--rv-glow', theme.glow);
  }
  const titleEl = document.getElementById('rv-console-title');
  if (titleEl) titleEl.textContent = theme.name;

  // Salvar no "Continue Jogando" (localStorage)
  try {
    const gameName = decodeURIComponent(game || '').split('/').pop().replace(/\.[^/.]+$/, '');
    const consoleKey = (game || '').split('/')[0];
    const consoleShorts = {snes:'SNES',nes:'NES',gba:'GBA',gbc:'GBC',n64:'N64',pcsx_rearmed:'PS1',segaMD:'SEGA',segaCD:'MEGA CD',segaGG:'GG',nds:'NDS',fbneo:'ARCADE'};
    const entry = {
      name: gameName.substring(0, 40),
      subtitle: '',
      file: decodeURIComponent(game || '').split('/').pop(),
      core: core,
      console: consoleKey,
      consoleShort: consoleShorts[core] || core.toUpperCase(),
      timestamp: Date.now()
    };
    let recent = JSON.parse(localStorage.getItem('rv_recent') || '[]');
    recent = recent.filter(r => r.file !== entry.file || r.console !== entry.console);
    recent.unshift(entry);
    recent = recent.slice(0, 8);
    localStorage.setItem('rv_recent', JSON.stringify(recent));
  } catch(e) {}
})();

const ROMS_BASE = 'https://retroverse-roms.mdsoltec.workers.dev/';

async function preloadGame(gamePath) {
  // Codifica cada segmento do path para lidar com apóstrofos e caracteres especiais
  const encodedPath = gamePath.split('/').map(seg => 
    encodeURIComponent(seg).replace(/'/g, '%27')
  ).join('/');

  // Lista de fontes para tentar carregar a ROM.
  // Game Gear aparece no catálogo como "gamegear", mas alguns projetos
  // guardam as ROMs em "gg" ou "segaGG". Tentamos os aliases sem quebrar
  // os caminhos originais dos demais consoles.
  const pathParts = gamePath.split('/');
  const systemKey = pathParts.shift() || '';
  const filenamePath = pathParts.join('/');
  const aliases = {
    gamegear: ['gamegear', 'GameGear', 'GAMEGEAR', 'gg', 'GG', 'segaGG'],
    segaGG: ['segaGG', 'gamegear', 'GameGear', 'gg', 'GG'],
  }[systemKey] || [systemKey];

  const candidateUrls = [];
  for (const alias of [...new Set(aliases)]) {
    candidateUrls.push(`roms/${alias}/${filenamePath.split('/').map(seg => encodeURIComponent(seg)).join('/')}`);
    candidateUrls.push(`roms/${alias}/${filenamePath}`);
    candidateUrls.push(ROMS_BASE + `${alias}/${filenamePath.split('/').map(seg => encodeURIComponent(seg)).join('/')}`);
  }
  candidateUrls.push(`roms/${encodedPath}`, `roms/${gamePath}`, ROMS_BASE + encodedPath);

  const msgEl = document.getElementById('rv-msg');
  const dlWrap = document.getElementById('rv-download-progress');
  const dlBar = document.getElementById('rv-dl-bar');
  const dlInfo = document.getElementById('rv-dl-info');

  let response = null;
  for (const url of candidateUrls) {
    try {
      const res = await fetch(url);
      if (res.ok) {
        response = res;
        // Registra se a ROM veio do servidor remoto: BIOS e demais anexos
        // precisam vir da MESMA fonte (roms/ local não existe no GitHub Pages).
        window.__rvRomFromRemote = url.startsWith(ROMS_BASE);
        console.log('[RetroVerso] ROM carregada com sucesso de:', url);
        break;
      }
    } catch(err) {
      // Tenta a próxima fonte
    }
  }

  if (!response) {
    console.error('[RetroVerso] ROM não encontrada. URLs tentadas:', candidateUrls);
    msgEl.textContent = 'Erro: ROM não encontrada em roms/ nem no servidor online.';
    throw new Error('ROM não encontrada em nenhuma fonte.');
  }

  try {
    const total = parseInt(response.headers.get('Content-Length') || '0');
    const reader = response.body.getReader();
    const chunks = [];
    let received = 0;
    if (total > 0) { msgEl.style.display = 'none'; dlWrap.classList.add('visible'); }
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value); received += value.length;
      if (total > 0) {
        dlBar.style.width = Math.round((received/total)*100) + '%';
        dlInfo.textContent = `${(received/1048576).toFixed(1)} MB / ${(total/1048576).toFixed(1)} MB`;
      }
    }
    dlWrap.classList.remove('visible'); msgEl.style.display = ''; msgEl.textContent = 'Iniciando emulador...';
    const fn = gamePath.split('/').pop();
    const mt = fn.endsWith('.zip') ? 'application/zip' : 'application/octet-stream';
    if (fn.endsWith('.zip')) return URL.createObjectURL(new File(chunks, fn, {type:mt}));
    return URL.createObjectURL(new Blob(chunks, {type:mt}));
  } catch(e) { msgEl.textContent = 'Erro ao baixar.'; throw e; }
}

EJS_player = '#game';

// O core DeSmuME 2015 expõe Pointer/Touch para a tela inferior do DS.
// Mantemos `core = 'nds'` para catálogo, overlays e cheats, mas usamos
// desmume2015 internamente para habilitar o stylus no navegador.
const isNDSCore = ['nds', 'melonds', 'desmume', 'desmume2015'].includes(core);
// Gambatte ('gb' no EmulatorJS) emula tanto GB quanto GBC; o EJS não possui
// um core chamado 'gbc' (gbc-wasm.data não existe → 404). Mantemos
// `core = 'gbc'` para catálogo, overlays, temas e cheats.
const isGBCCore = core === 'gbc';
const emulatorCore = isNDSCore ? 'desmume2015' : (isGBCCore ? 'gb' : core);
EJS_core = emulatorCore;
window.__RV_IS_NDS = isNDSCore;

if (isNDSCore) {
  EJS_defaultOptions = {
    // Duas telas em pé: superior + inferior/touch.
    desmume_screens_layout: 'top/bottom',
    // Usa o Pointer API em vez de mouse relativo.
    desmume_pointer_mouse: 'enabled',
    desmume_pointer_type: 'touch'
  };
}

/* ═══ VERSÃO FIXADA DO EMULATORJS ═══
   'stable' é um alias móvel: quando o projeto sobe de versão, os patches
   de runtime do RetroVerso (cheats, BIOS trap, stylus NDS, MediaRecorder
   stub) podem quebrar SEM aviso. Fixamos a tag exata que hoje serve o
   stable (v4.2.3 — bytes idênticos, verificado por hash do CDN).
   Para atualizar: troque o número AQUI e no sw.js (warmup). */
const RV_EJS_CDN = 'https://cdn.emulatorjs.org/4.2.3/data/';
EJS_pathtodata = RV_EJS_CDN;

/* ═══ STYLUS / TOUCH DO NINTENDO DS ═══ */
// Frações do canvas onde fica a tela touch (metade inferior do vídeo empilhado).
// Os valores são recalculados em tempo de execução por syncNDSStylusRegion():
// o EJS desenha o vídeo com letterbox dentro de um canvas do tamanho da tela,
// então assumir top:0.50 do VIEWPORT deixa parte da tela touch sem resposta.
const NDS_TOUCH_REGION = { top: 0.50, bottom: 1, left: 0, right: 1 };

// Posiciona a camada de stylus exatamente sobre a tela inferior do DS e
// recalibra NDS_TOUCH_REGION. O EJS desenha o vídeo com letterbox TOP-ALINHADO
// e centralizado horizontalmente dentro do canvas; como o play fixa o layout
// 'top/bottom' do DeSmuME, o vídeo são duas telas 256x192 empilhadas (256x384).
function syncNDSStylusRegion() {
  if (!isNDSCore) return false;
  const canvas = getNDSCanvas();
  const layer = document.getElementById('rv-nds-stylus-layer');
  if (!canvas) return false;
  const el = canvas.getBoundingClientRect();
  if (!el.width || !el.height) return false;

  const scale = Math.min(el.width / 256, el.height / 384);
  const videoW = 256 * scale;
  const videoH = 384 * scale;
  const videoLeft = el.left + (el.width - videoW) / 2;
  const videoTop = el.top;

  const touch = { left: videoLeft, top: videoTop + videoH / 2, right: videoLeft + videoW, bottom: videoTop + videoH };
  NDS_TOUCH_REGION.left = (touch.left - el.left) / el.width;
  NDS_TOUCH_REGION.right = (touch.right - el.left) / el.width;
  NDS_TOUCH_REGION.top = (touch.top - el.top) / el.height;
  NDS_TOUCH_REGION.bottom = (touch.bottom - el.top) / el.height;

  if (layer) {
    layer.style.left = touch.left + 'px';
    layer.style.top = touch.top + 'px';
    layer.style.width = (touch.right - touch.left) + 'px';
    layer.style.height = (touch.bottom - touch.top) + 'px';
    layer.style.right = 'auto';
    layer.style.bottom = 'auto';
  }
  return true;
}

window.RV_SYNC_NDS_STYLUS = syncNDSStylusRegion;

function getNDSCanvas() {
  return document.querySelector('#game canvas') || window.EJS_emulator?.canvas || null;
}

function forwardNDSStylus(action, point) {
  if (!isNDSCore || !point) return false;
  const canvas = getNDSCanvas();
  if (!canvas) return false;

  const rect = canvas.getBoundingClientRect();
  if (!rect.width || !rect.height) return false;
  const clientX = Number(point.clientX);
  const clientY = Number(point.clientY);
  if (!Number.isFinite(clientX) || !Number.isFinite(clientY)) return false;

  const nx = (clientX - rect.left) / rect.width;
  const ny = (clientY - rect.top) / rect.height;
  const active = action !== 'end';
  const inside = nx >= NDS_TOUCH_REGION.left && nx <= NDS_TOUCH_REGION.right
    && ny >= NDS_TOUCH_REGION.top && ny <= NDS_TOUCH_REGION.bottom;
  if (!inside && action === 'start') return false;

  const pointerType = point.pointerType || 'touch';
  const pointerId = point.pointerId ?? point.identifier ?? 1;
  const pointerEventName = action === 'start' ? 'pointerdown'
    : action === 'end' ? 'pointerup' : 'pointermove';
  const mouseEventName = action === 'start' ? 'mousedown'
    : action === 'end' ? 'mouseup' : 'mousemove';
  const buttons = active ? 1 : 0;

  // DeSmuME 2015 com desmume_pointer_type=touch usa Pointer API.
  try {
    if (window.PointerEvent) {
      canvas.dispatchEvent(new PointerEvent(pointerEventName, {
        bubbles: true,
        cancelable: true,
        pointerId,
        pointerType,
        isPrimary: true,
        clientX,
        clientY,
        screenX: point.screenX ?? clientX,
        screenY: point.screenY ?? clientY,
        buttons,
        button: active ? 0 : 0,
        pressure: active ? 0.5 : 0
      }));
    }
  } catch (error) {}

  // Fallback para builds que expõem a tela como Mouse API.
  try {
    canvas.dispatchEvent(new MouseEvent(mouseEventName, {
      bubbles: true,
      cancelable: true,
      clientX,
      clientY,
      screenX: point.screenX ?? clientX,
      screenY: point.screenY ?? clientY,
      buttons,
      button: 0
    }));
  } catch (error) {}

  return true;
}

window.RV_NDS_STYLUS = forwardNDSStylus;

// Tenta calibrar a camada até o canvas existir; depois reage a resize,
// rotação, fullscreen/teatro e a mudanças de tamanho do próprio canvas.
function startNDSStylusSync(layer) {
  if (window.__rvNdsSyncTimer) return;
  let attempts = 0;
  const activar = ok => {
    if (!ok) return false;
    layer.classList.add('active');
    if (!window.__rvNdsSyncListeners) {
      window.__rvNdsSyncListeners = true;
      ['resize', 'orientationchange', 'fullscreenchange'].forEach(evt =>
        window.addEventListener(evt, () => syncNDSStylusRegion()));
      const canvas = getNDSCanvas();
      if (canvas && window.ResizeObserver) {
        try { new ResizeObserver(() => syncNDSStylusRegion()).observe(canvas); } catch (error) {}
      }
    }
    return true;
  };
  if (activar(syncNDSStylusRegion())) return;
  window.__rvNdsSyncTimer = setInterval(() => {
    attempts++;
    if (activar(syncNDSStylusRegion()) || attempts > 120) {
      clearInterval(window.__rvNdsSyncTimer);
      window.__rvNdsSyncTimer = null; // libera nova tentativa se o boot falhou
    }
  }, 500);
}

function initNDSStylus() {
  if (!isNDSCore) return;
  const layer = document.getElementById('rv-nds-stylus-layer');
  if (!layer || layer.dataset.bound === '1') {
    if (layer) startNDSStylusSync(layer);
    return;
  }

  const activePointers = new Set();
  const pointerIdOf = event => event.pointerId ?? 1;

  layer.addEventListener('pointerdown', event => {
    if (event.pointerType === 'mouse' && event.button !== 0) return;
    if (!forwardNDSStylus('start', event)) return;
    activePointers.add(pointerIdOf(event));
    try { layer.setPointerCapture(pointerIdOf(event)); } catch (error) {}
    event.preventDefault();
  }, { passive: false });

  layer.addEventListener('pointermove', event => {
    if (!activePointers.has(pointerIdOf(event))) return;
    forwardNDSStylus('move', event);
    event.preventDefault();
  }, { passive: false });

  const finish = event => {
    const id = pointerIdOf(event);
    if (!activePointers.has(id)) return;
    forwardNDSStylus('end', event);
    activePointers.delete(id);
    try { layer.releasePointerCapture(id); } catch (error) {}
    event.preventDefault();
  };

  layer.addEventListener('pointerup', finish, { passive: false });
  layer.addEventListener('pointercancel', finish, { passive: false });
  window.addEventListener('blur', () => {
    activePointers.clear();
  });

  layer.dataset.bound = '1';
  startNDSStylusSync(layer);
}

/* ── SISTEMA DE SAVES RETROVERSO ───────────────────────────────────
   UM slot por jogo: "Salvar" sobrescreve o save anterior do mesmo jogo
   (a linha de info da barra deixa isso explícito e mostra data/tamanho).
   O estado completo do emulador (save-state) fica em IndexedDB próprio
   ("RetroVerso-saves"), independente do menu nativo do EmulatorJS:
   o que a barra salva é exatamente o que a barra carrega. */
const RV_SAVES_DB = 'RetroVerso-saves';
const RV_SAVES_STORE = 'saves';

function rvSavesOpen() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error('IndexedDB indisponível')); return; }
    const req = indexedDB.open(RV_SAVES_DB, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(RV_SAVES_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
    req.onblocked = () => reject(new Error('IndexedDB bloqueado'));
  });
}
function rvSavesRun(mode, op) {
  return rvSavesOpen().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(RV_SAVES_STORE, mode);
    const req = op(tx.objectStore(RV_SAVES_STORE));
    tx.oncomplete = () => { db.close(); resolve(req && req.result); };
    tx.onerror = () => { db.close(); reject(tx.error); };
    tx.onabort = () => { db.close(); reject(tx.error); };
  }));
}
const rvSaveGet = (key) => rvSavesRun('readonly', st => st.get(key));
const rvSavePut = (key, val) => rvSavesRun('readwrite', st => st.put(val, key));
const rvSaveDel = (key) => rvSavesRun('readwrite', st => st.delete(key));

// Identidade do save = core + "console/arquivo" (mesmo valor da URL do jogo).
function rvSaveKey() {
  const file = decodeURIComponent(((typeof game === 'string' ? game : '') || '').split('?')[0]);
  return (typeof core === 'string' ? core : '?') + '|' + file;
}
const rvGameLabel = () =>
  decodeURIComponent(((typeof game === 'string' ? game : '') || '').split('/').pop() || 'Jogo').replace(/\.[^/.]+$/, '');
const rvFmtBytes = (n) => (n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB');
const rvFmtDate = (iso) => new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });

async function rvSaveNow() {
  const gm = window.EJS_emulator && window.EJS_emulator.gameManager;
  if (!gm || typeof gm.getState !== 'function') {
    if (typeof showToast === 'function') showToast('Este núcleo não suporta save-state');
    return false;
  }
  try {
    let state = await Promise.resolve(gm.getState());
    if (!state) throw new Error('estado vazio');
    if (state instanceof Uint8Array) state = state.slice(); // cópia defensiva
    const key = rvSaveKey();
    const prev = await rvSaveGet(key);
    const rec = {
      game: key, rom: rvGameLabel(), core: (typeof core === 'string' ? core : ''),
      bytes: state.byteLength || state.length || 0,
      savedAt: new Date().toISOString(), state
    };
    await rvSavePut(key, rec);
    if (typeof showToast === 'function') {
      showToast((prev ? 'Save substituído: ' : 'Save gravado: ') + rvFmtDate(rec.savedAt) + ' · ' + rvFmtBytes(rec.bytes));
    }
    refreshRvSaveInfo();
    return true;
  } catch (err) {
    console.warn('[RetroVerso] falha ao gravar save:', err);
    if (typeof showToast === 'function') showToast('Falha ao gravar o save');
    return false;
  }
}
window.rvSaveNow = rvSaveNow;

async function rvLoadNow() {
  const gm = window.EJS_emulator && window.EJS_emulator.gameManager;
  if (!gm || typeof gm.loadState !== 'function') {
    if (typeof showToast === 'function') showToast('Este núcleo não suporta save-state');
    return false;
  }
  try {
    const rec = await rvSaveGet(rvSaveKey());
    if (!rec || !rec.state) {
      if (typeof showToast === 'function') showToast('Nenhum save gravado para este jogo');
      return false;
    }
    await Promise.resolve(gm.loadState(rec.state));
    if (typeof showToast === 'function') showToast('Save carregado (' + rvFmtDate(rec.savedAt) + ')');
    return true;
  } catch (err) {
    console.warn('[RetroVerso] falha ao carregar save:', err);
    if (typeof showToast === 'function') showToast('Falha ao carregar o save');
    return false;
  }
}
window.rvLoadNow = rvLoadNow;

/* Atualiza a linha "Save deste jogo" com o que existe de fato no banco:
   data, tamanho e disponibilidade dos botões Carregar/Apagar. */
async function refreshRvSaveInfo() {
  const info = document.getElementById('rv-sys-save-info');
  const delBtn = document.getElementById('rv-sys-del');
  const loadBtn = document.querySelector('#rv-sys-bar [data-sys="load"]');
  if (!info) return;
  try {
    const rec = await rvSaveGet(rvSaveKey());
    if (rec && rec.state) {
      info.textContent = 'Save deste jogo: ' + rvFmtDate(rec.savedAt) + ' · ' + rvFmtBytes(rec.bytes || (rec.state.byteLength || 0));
      if (delBtn) delBtn.hidden = false;
      if (loadBtn) loadBtn.classList.remove('rv-dim');
    } else {
      info.textContent = 'Nenhum save gravado neste jogo';
      if (delBtn) delBtn.hidden = true;
      if (loadBtn) loadBtn.classList.add('rv-dim');
    }
  } catch (e) {
    info.textContent = 'Saves indisponíveis neste navegador';
    if (delBtn) delBtn.hidden = true;
  }
}

function bindEmulatorMenuToCheats() {
  const emulator = window.EJS_emulator;
  if (!emulator) return false;

  // O botão hambúrguer chama este método internamente. Redirecionar o método
  // também cobre versões do EmulatorJS que recriam o botão touch dinamicamente.
  if (emulator.menu && !emulator.menu.__rvCheatsRedirected) {
    emulator.menu.toggle = () => openRetroVerseCheats();
    emulator.menu.__rvCheatsRedirected = true;
  }

  const menuButton = emulator.elements?.menuToggle
    || document.querySelector('.ejs_virtualGamepad_open');
  if (!menuButton || menuButton.dataset.rvCheatsMenuBound === '1') return true;

  let lastHandled = 0;
  const redirect = (event) => {
    event.preventDefault();
    event.stopPropagation();
    event.stopImmediatePropagation();

    // Um toque dispara touchstart, touchend e click; abre apenas uma vez.
    const now = Date.now();
    if (now - lastHandled < 450) return;
    lastHandled = now;
    openRetroVerseCheats();
  };

  ['touchstart', 'touchend', 'mousedown', 'mouseup', 'click'].forEach(type => {
    menuButton.addEventListener(type, redirect, { capture: true, passive: false });
  });
  menuButton.dataset.rvCheatsMenuBound = '1';
  menuButton.setAttribute('aria-label', 'Cheats');
  menuButton.title = 'Cheats';
  return true;
}

/* ═══ CARREGAMENTO DA BASE DE CHEATS ═══
   A versão do EmulatorJS usada pelo loader não encaminha EJS_cheatPath
   automaticamente. Por isso carregamos o JSON e entregamos os códigos em
   EJS_cheats antes de iniciar o loader.
═══════════════════════════════════════════════════════════ */
function normalizeCheatName(value) {
  return decodeURIComponent(String(value || ''))
    .replace(/\.[^/.]+$/, '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .replace(/[_]+/g, ' ')
    .replace(/[.!]+$/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function cheatNameForms(value) {
  const full = normalizeCheatName(value);
  const edition = full
    .replace(/\s*\([^)]*\)/g, '')
    .replace(/\s*\[[^\]]*\]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
  return { full, edition };
}

function findCheatEntries(database, romName) {
  if (!database || typeof database !== 'object') return [];

  const target = cheatNameForms(romName);
  const matches = [];
  for (const [title, entries] of Object.entries(database)) {
    if (!Array.isArray(entries)) continue;
    const key = cheatNameForms(title);
    let score = 0;
    if (key.full === target.full) score = 100;
    else if (key.edition === target.edition) score = 90;
    else if (target.full.startsWith(key.full + ' (') || target.full.startsWith(key.full + ' -')) score = 70;
    if (score > 0) matches.push({ score, entries });
  }

  // Permite aliases sem duplicar cheats quando há mais de uma chave para a ROM.
  matches.sort((a, b) => b.score - a.score);
  const result = [];
  const seen = new Set();
  for (const match of matches) {
    for (const item of match.entries) {
      if (!item || typeof item.desc !== 'string' || typeof item.code !== 'string') continue;
      if (!item.desc.trim() || !item.code.trim()) continue;
      const id = `${item.desc.trim()}\u0000${item.code.trim()}`;
      if (seen.has(id)) continue;
      seen.add(id);
      result.push([item.desc.trim(), item.code.trim()]);
    }
  }
  return result;
}

async function loadRetroVerseCheats() {
  const base = String(window.EJS_cheatPath || 'cheats/')
    .replace(/\/+$/, '') + '/';
  const cheatCore = isNDSCore ? 'nds' : core;
  const paths = [
    `${base}cheats.json`,
    `${base}${encodeURIComponent(cheatCore)}.json`
  ];

  const databases = [];
  for (const path of paths) {
    try {
      const url = new URL(path, document.baseURI).href;
      const response = await fetch(url, { cache: 'no-store' });
      if (!response.ok) continue;
      const data = await response.json();
      if (data && typeof data === 'object') databases.push(data);
    } catch (error) {
      console.warn('[RetroVerso] Não foi possível carregar cheats:', path, error);
    }
  }

  const database = Object.assign({}, ...databases);
  const romName = window.EJS_gameName || decodeURIComponent((game || '').split('/').pop() || '');
  window.EJS_cheats = findCheatEntries(database, romName);
  console.info(`[RetroVerso] Cheats carregados para "${romName}": ${window.EJS_cheats.length}`);
}

let __rvLoaderStarted = false;
async function startRetroVerseEmulator() {
  if (__rvLoaderStarted) return;
  __rvLoaderStarted = true;

  try {
    await loadRetroVerseCheats();
  } catch (error) {
    window.EJS_cheats = [];
    console.warn('[RetroVerso] Falha ao preparar cheats:', error);
  }

  const script = document.createElement('script');
  script.src = RV_EJS_CDN + 'loader.js';
  document.body.appendChild(script);

  /* Watchdog de boot: se o núcleo não levantar em 30s, mostra o erro na
     tela em vez de deixar tela preta + controles "vivos" sem jogo. */
  window.__rvBootWatchdog = setTimeout(() => {
    try {
      if (window.EJS_emulator && window.EJS_emulator.started) return;
      const msg = document.getElementById('rv-msg');
      if (msg) {
        const detalhe = window.__rvLastError ? ' [' + String(window.__rvLastError).slice(0, 90) + ']' : '';
        msg.textContent = 'O núcleo não iniciou neste navegador.' + detalhe + ' Recarregue; se persistir, atualize o navegador.';
        msg.style.color = '#ff7777';
        msg.style.whiteSpace = 'normal';
        msg.style.maxWidth = '320px';
      }
      console.warn('[RetroVerso] watchdog: emulador não iniciou em 30s.', window.__rvLastError || '');
    } catch (e) { }
  }, 30000);
}

if (isArcade) {
  // O fluxo padrão do EmulatorJS extrai o neogeo.zip em arquivos soltos na raiz
  // do FS virtual — e o FBNeo só reconhece o romset se encontrar o ARQUIVO
  // neogeo.zip ao lado da ROM. Interceptamos a criação do emulador (mesmo
  // padrão de patch em runtime já usado no menu de cheats) e regravamos a BIOS
  // como arquivo único. Instalado só para arcade; demais consoles intactos.
  if (!window.__rvBiosTrapInstalled) {
    window.__rvBiosTrapInstalled = true;
    let __rvEjsInstance = null;
    Object.defineProperty(window, 'EJS_emulator', {
      configurable: true,
      get() { return __rvEjsInstance; },
      set(inst) {
        if (inst && !inst.__rvBiosPatched && typeof inst.downloadBios === 'function') {
          inst.__rvBiosPatched = true;
          inst.downloadBios = async function () {
            const url = this.config && this.config.biosUrl;
            if (!url) return;
            try {
              const resp = await fetch(url);
              if (!resp.ok) throw new Error('HTTP ' + resp.status);
              const nome = url.split('/').pop().split('?')[0] || 'neogeo.zip';
              this.gameManager.FS.writeFile(nome, new Uint8Array(await resp.arrayBuffer()));
              this.config.biosUrl = url;
            } catch (err) {
              console.error('[RetroVerso] Falha ao baixar BIOS:', url, err);
              if (this.startGameError) this.startGameError(this.localization ? this.localization('Network Error') : 'Network Error');
              return; // deixa o próprio FBNeo exibir a tela de romset ausente
            }
          };
        }
        __rvEjsInstance = inst;
      }
    });
  }
  preloadGame(game).then(blobUrl => {
    EJS_gameUrl = blobUrl;
    // A BIOS do NeoGeo precisa vir da mesma fonte que serviu a ROM.
    // Antes: sempre 'roms/arcade/neogeo.zip' → 404 no GitHub Pages →
    // o EmulatorJS logava "Network Error" e o jogo nunca iniciava.
    EJS_biosUrl = (window.__rvRomFromRemote ? ROMS_BASE : 'roms/') + 'arcade/neogeo.zip';
    EJS_onGameStart = onGameReady; setTimeout(onGameReady, 14000);
    startRetroVerseEmulator();
  }).catch(() => {
    EJS_gameUrl = ROMS_BASE + game;
    EJS_biosUrl = ROMS_BASE + 'arcade/neogeo.zip';
    EJS_onGameStart = onGameReady; setTimeout(onGameReady, 14000);
    startRetroVerseEmulator();
  });
} else {
  // genesis_plus_gx exige a BIOS do Sega CD (bios_CD_U.bin) junto ao conteúdo.
  // Sonda as fontes (mesma ordem local→remoto das ROMs) e só define EJS_biosUrl
  // se o arquivo existir — sem a BIOS o comportamento anterior é mantido.
  const SCD_BIOS_PATH = 'segacd/bios_CD_U.bin';
  const configureSegaCDBios = async () => {
    if (core !== 'segaCD') return;
    const urls = ['roms/' + SCD_BIOS_PATH, ROMS_BASE + SCD_BIOS_PATH];
    for (const url of urls) {
      try {
        const head = await fetch(url, { method: 'HEAD' });
        if (head.ok) { EJS_biosUrl = url; console.log('[RetroVerso] BIOS do Sega CD configurada:', url); return; }
      } catch (error) {}
    }
    console.warn('[RetroVerso] BIOS do Sega CD não encontrada (' + SCD_BIOS_PATH + '). O jogo pode não iniciar.');
  };
  preloadGame(game).then(async blobUrl => {
    EJS_gameUrl = blobUrl; EJS_onGameStart = onGameReady; setTimeout(onGameReady, 14000);
    await configureSegaCDBios();
    startRetroVerseEmulator();
  }).catch(() => {
    document.getElementById('rv-msg').textContent = 'Erro ao carregar.';
    initControls(); // Mostra overlay mesmo em erro/teste sem ROM
  });
}

/* Register Service Worker (PWA) — sw.js na raiz; só intercepta GET same-origin
   (ROMs/CDN passam direto), então não interfere no boot do emulador. */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js', { scope: './' }).catch(() => { });

function sendInput(id, val) {
  try {
    const manager = window.EJS_emulator?.gameManager;
    if (!manager) return;
    if (typeof manager.simulateInput === 'function') {
      manager.simulateInput(0, id, val);
    } else if (typeof manager.functions?.simulateInput === 'function') {
      manager.functions.simulateInput(0, id, val);
    }
    if (new URLSearchParams(window.location.search).has('debug')) {
      console.log('[RetroVerso] input', { id, val });
    }
  } catch (e) {}
}

/* ═══════════════════════════════════════════════════════════
   INIT CONTROLS
   Portrait + overlay disponível → sistema de imagem calibrado
   Landscape ou sem overlay → controles CSS
═══════════════════════════════════════════════════════════ */
let __rvInitPromise = null;   // single-flight: impede execuções concorrentes do initControls
async function initControls(force = false) {
  // Se já há uma inicialização em andamento, reutiliza-a (evita múltiplos engines)
  if (__rvInitPromise) { return __rvInitPromise; }

  __rvInitPromise = (async () => {
    // Aguarda o EJS_emulator estar pronto (se ainda não estiver) para que o
    // envio de input funcione. Timeout de 8s para não travar a tela.
    const t0 = Date.now();
    while ((!window.EJS_emulator || !window.EJS_emulator.gameManager) && Date.now() - t0 < 8000) {
      await new Promise(r => setTimeout(r, 150));
    }

    // Garante que o botão/menu touch também abra Cheats depois que o EJS estiver pronto.
    bindEmulatorMenuToCheats();
    initNDSStylus();

    // Destrói qualquer engine antigo de forma segura
    if (window.__rvRAEngine && window.__rvRAEngine.destroy) {
      try { window.__rvRAEngine.destroy(); } catch(e){}
      window.__rvRAEngine = null;
    }

    const W = window.innerWidth, H = window.innerHeight;
    const isPortrait = H > W;

    const overlayWrap = document.getElementById('rv-overlay');
    const padWrap = document.getElementById('rv-pad');

    overlayWrap.classList.remove('active');
    overlayWrap.innerHTML = '';
    padWrap.classList.remove('active');
    padWrap.innerHTML = '';

    const DEBUG = new URLSearchParams(window.location.search).has('debug') || window.location.search.toLowerCase().includes('debug');

    // 1º Tenta carregar arquivo .cfg automático do RetroArch (ex: overlays/n64/n64.cfg)
    if (typeof window.loadRetroArchOverlay === 'function') {
      const raEngine = await window.loadRetroArchOverlay(core, overlayWrap, { debug: DEBUG, isPortrait });
      if (raEngine) {
        window.__rvRAEngine = raEngine;
        overlayWrap.classList.add('active');
        return;
      }
    }

    const overlay = OVERLAYS[core];
    if (isPortrait && overlay && overlay.base) {
      buildOverlay(overlay);
    } else {
      buildPad(SKINS[core] || SKINS['snes']);
    }
  })();

  // Libera o "single-flight" após terminar (para permitir re-init em resize/orientação)
  try { await __rvInitPromise; } finally { __rvInitPromise = null; }
}

/* ═══════════════════════════════════════════════════════════
   BUILD OVERLAY (sistema calibrado com zonas de toque)
═══════════════════════════════════════════════════════════ */
function buildOverlay(cfg) {
  const wrap = document.getElementById('rv-overlay');
  wrap.innerHTML = '';

  const W = window.innerWidth;
  const H = window.innerHeight;
  const containerH = Math.round(W * cfg.aspect);
  
  // Modo debug: adiciona ?debug=1 na URL para ver as zonas
  const DEBUG = new URLSearchParams(window.location.search).has('debug') || window.location.search.toLowerCase().includes('debug');

  // Seta o tamanho do container (limita à altura da tela)
  const actualH = Math.min(containerH, H);
  Object.assign(wrap.style, {
    width: W + 'px',
    height: actualH + 'px',
  });

  // Imagem base
  const baseImg = document.createElement('img');
  baseImg.className = 'rv-skin-img';
  baseImg.src = cfg.base;
  baseImg.draggable = false;
  Object.assign(baseImg.style, {
    width: W + 'px',
    height: containerH + 'px',
    position: 'absolute',
    bottom: '0',
    left: '0',
  });
  wrap.appendChild(baseImg);

  // Imagem animada
  let animImg = null;
  if (cfg.animated) {
    animImg = document.createElement('img');
    animImg.className = 'rv-anim-img';
    animImg.src = cfg.animated;
    animImg.draggable = false;
    Object.assign(animImg.style, {
      width: W + 'px',
      height: containerH + 'px',
      position: 'absolute',
      bottom: '0',
      left: '0',
    });
    wrap.appendChild(animImg);
  }

  // Pré-carrega animações de botões
  if (cfg.animButtons) {
    for (const src of Object.values(cfg.animButtons)) { const i = new Image(); i.src = src; }
  }

  function showAnim(src) {
    if (!animImg) return;
    if (src) { animImg.src = src; animImg.classList.add('show'); }
    else { animImg.classList.remove('show'); }
  }

  // Helper: calcula posição em px a partir de % da imagem
  // As coordenadas são % da imagem inteira (que pode ser maior que o container visível)
  // Precisamos converter para posição dentro do container
  const offsetY = containerH - actualH; // Quanto da imagem está cortada no topo
  const px = (pct, dim) => {
    if (dim === 'x') return (pct / 100) * W;
    // Para Y: converte % da imagem para px dentro do container
    return (pct / 100) * containerH - offsetY;
  };

  if (DEBUG) {
    console.log('Overlay debug:', { W, H, containerH, actualH, offsetY });
  }

  // Cria zonas de toque
  for (const [name, zone] of Object.entries(cfg.zones)) {
    if (zone.type === 'dpad') {
      const el = document.createElement('div');
      el.className = 'rv-zone rv-zone-dpad';
      const zw = px(zone.w, 'x'), zh = px(zone.h, 'y');
      Object.assign(el.style, {
        left: (px(zone.x, 'x') - zw/2) + 'px',
        top: (px(zone.y, 'y') - zh/2) + 'px',
        width: zw + 'px', height: zh + 'px',
      });
      
      if (DEBUG) {
        el.style.border = '2px solid lime';
        el.style.background = 'rgba(0,255,0,0.2)';
        el.textContent = 'DPAD';
        el.style.color = 'lime';
        el.style.fontSize = '10px';
        el.style.fontWeight = 'bold';
        el.style.display = 'flex';
        el.style.alignItems = 'center';
        el.style.justifyContent = 'center';
      }

      const st = {up:0,down:0,left:0,right:0};
      const ID = {up:EJS_INPUT.UP,down:EJS_INPUT.DOWN,left:EJS_INPUT.LEFT,right:EJS_INPUT.RIGHT};
      function upd(ns) { for (const d in st) if (ns[d]!==st[d]) { sendInput(ID[d],ns[d]); st[d]=ns[d]; }
        if (cfg.animButtons) { let s=null; if(ns.up)s=cfg.animButtons.UP; else if(ns.down)s=cfg.animButtons.DOWN; else if(ns.left)s=cfg.animButtons.LEFT; else if(ns.right)s=cfg.animButtons.RIGHT; showAnim(s); }
      }
      function getDir(px2,py2) {
        const r=el.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
        const dx=px2-cx, dy=py2-cy, a=Math.atan2(dy,dx), d=Math.sqrt(dx*dx+dy*dy);
        if (d < r.width*0.08) return {up:0,down:0,left:0,right:0};
        if (a>-Math.PI/4&&a<=Math.PI/4) return {up:0,down:0,left:0,right:1};
        if (a>Math.PI/4&&a<=3*Math.PI/4) return {up:0,down:1,left:0,right:0};
        if (a>-3*Math.PI/4&&a<=-Math.PI/4) return {up:1,down:0,left:0,right:0};
        return {up:0,down:0,left:1,right:0};
      }
      const clr = () => upd({up:0,down:0,left:0,right:0});
      el.addEventListener('touchstart', e=>{e.preventDefault();e.stopPropagation();upd(getDir(e.touches[0].clientX,e.touches[0].clientY));},{passive:false});
      el.addEventListener('touchmove', e=>{e.preventDefault();e.stopPropagation();upd(getDir(e.touches[0].clientX,e.touches[0].clientY));},{passive:false});
      el.addEventListener('touchend', e=>{e.preventDefault();e.stopPropagation();clr();},{passive:false});
      el.addEventListener('touchcancel', e=>{e.preventDefault();e.stopPropagation();clr();},{passive:false});
      wrap.appendChild(el);

    } else if (zone.type === 'analog') {
      // Zona de analógico (placeholder — mostra imagem do stick se disponível)
      const el = document.createElement('div');
      el.className = 'rv-zone';
      const zw = px(zone.w, 'x'), zh = px(zone.h, 'y');
      Object.assign(el.style, {
        left: (px(zone.x, 'x') - zw/2) + 'px',
        top: (px(zone.y, 'y') - zh/2) + 'px',
        width: zw + 'px', height: zh + 'px',
        borderRadius: '50%',
      });

      // Analog stick logic
      const R2 = zw / 2;
      const MAX = R2 * 0.6;
      const THRESH = 0.40, AV = 0x7fff;
      const sent = {up:0,down:0,left:0,right:0};
      const DM = {up:EJS_INPUT.UP,down:EJS_INPUT.DOWN,left:EJS_INPUT.LEFT,right:EJS_INPUT.RIGHT};
      function sDir(d,v){if(sent[d]===v)return;sent[d]=v;sendInput(DM[d],v);}
      function sAn(nx,ny){
        sendInput(EJS_INPUT.LSTICK_RIGHT,nx>0?Math.round(nx*AV):0);
        sendInput(EJS_INPUT.LSTICK_LEFT,nx<0?Math.round(-nx*AV):0);
        sendInput(EJS_INPUT.LSTICK_DOWN,ny>0?Math.round(ny*AV):0);
        sendInput(EJS_INPUT.LSTICK_UP,ny<0?Math.round(-ny*AV):0);
      }
      function relAll(){sDir('up',0);sDir('down',0);sDir('left',0);sDir('right',0);sAn(0,0);}

      let active=false, ox=0, oy=0;
      function onS(e){e.preventDefault();e.stopPropagation();const t=e.touches?e.touches[0]:e;const r=el.getBoundingClientRect();active=true;ox=r.left+R2;oy=r.top+R2;mv(t.clientX-ox,t.clientY-oy);}
      function onM(e){if(!active)return;e.preventDefault();const t=e.touches?e.touches[0]:e;mv(t.clientX-ox,t.clientY-oy);}
      function onE(e){e.preventDefault();e.stopPropagation();active=false;relAll();}
      function mv(dx,dy){
        const dist=Math.sqrt(dx*dx+dy*dy),cl=Math.min(dist,MAX),ang=Math.atan2(dy,dx);
        const cx2=Math.cos(ang)*cl,cy2=Math.sin(ang)*cl;
        const nx=cx2/MAX,ny=cy2/MAX;
        sAn(nx,ny);
        sDir('right',nx>THRESH?1:0);sDir('left',nx<-THRESH?1:0);
        sDir('down',ny>THRESH?1:0);sDir('up',ny<-THRESH?1:0);
      }
      el.addEventListener('touchstart',onS,{passive:false});
      el.addEventListener('touchmove',onM,{passive:false});
      el.addEventListener('touchend',onE,{passive:false});
      el.addEventListener('touchcancel',onE,{passive:false});
      wrap.appendChild(el);

    } else if (zone.type === 'btn') {
      const el = document.createElement('div');
      el.className = 'rv-zone';
      const zw = px(zone.w, 'x'), zh = px(zone.h, 'y');
      Object.assign(el.style, {
        left: (px(zone.x, 'x') - zw/2) + 'px',
        top: (px(zone.y, 'y') - zh/2) + 'px',
        width: zw + 'px', height: zh + 'px',
        borderRadius: '30%',
      });

      if (DEBUG) {
        el.style.border = '2px solid red';
        el.style.background = 'rgba(255,0,0,0.2)';
        el.textContent = name;
        el.style.color = 'red';
        el.style.fontSize = '9px';
        el.style.fontWeight = 'bold';
        el.style.display = 'flex';
        el.style.alignItems = 'center';
        el.style.justifyContent = 'center';
      }

      const inputId = zone.input;
      const btnName = name;

      function press() {
        el.classList.add('pressed');
        sendInput(inputId, 1);
        if (cfg.animButtons?.[btnName]) showAnim(cfg.animButtons[btnName]);
      }
      function release() {
        el.classList.remove('pressed');
        sendInput(inputId, 0);
        showAnim(null);
      }

      el.addEventListener('touchstart', e=>{e.preventDefault();e.stopPropagation();press();},{passive:false});
      el.addEventListener('touchend', e=>{e.preventDefault();e.stopPropagation();release();},{passive:false});
      el.addEventListener('touchcancel', e=>{e.preventDefault();e.stopPropagation();release();},{passive:false});
      el.addEventListener('mousedown', e=>{e.preventDefault();e.stopPropagation();press();});
      el.addEventListener('mouseup', e=>{e.preventDefault();e.stopPropagation();release();});
      wrap.appendChild(el);
    }
  }

  wrap.classList.add('active');
}

/* ═══════════════════════════════════════════════════════════
   BUILD PAD (CSS fallback para landscape)
═══════════════════════════════════════════════════════════ */
function buildPad(skin) {
  const pad = document.getElementById('rv-pad');
  pad.innerHTML = '';
  const W = window.innerWidth, H = window.innerHeight, LS = W > H;
  const isNDSLayout = isNDSCore;
  // No fallback do DS, a barra é transparente para não esconder a tela touch.
  const BAR_H = LS ? H : (isNDSLayout ? Math.round(Math.min(H * 0.20, 170)) : Math.round(Math.min(H*0.42,260)));
  const BAR_Y = H - BAR_H;
  const barBackground = isNDSLayout ? 'transparent' : skin.barBg;
  const COL_W = LS ? Math.round(Math.min(W*0.24,180)) : Math.round(W*0.50);
  const MAR=8, REF=LS?COL_W:BAR_H;
  const DS=Math.round(Math.min(REF*0.72,LS?COL_W-16:160));
  const BS=Math.round(Math.min(REF*0.28,LS?(COL_W-DS)*0.9:62));
  const GAP=Math.round(BS*0.10);
  const SW=Math.round(Math.min(COL_W*0.90,LS?COL_W-2*MAR:88));
  const SH=Math.round(Math.min(REF*0.14,34));
  const MW=Math.round(Math.min(LS?COL_W-2*MAR:W*0.14,72));
  const MH=Math.round(Math.min(REF*0.12,28));

  if(LS){[0,W-COL_W].forEach(x=>{const d=document.createElement('div');Object.assign(d.style,{position:'absolute',left:x+'px',top:'0',width:COL_W+'px',height:H+'px',background:barBackground,zIndex:'1',pointerEvents:'none'});pad.appendChild(d);});}
  else{const d=document.createElement('div');Object.assign(d.style,{position:'absolute',left:'0',top:BAR_Y+'px',width:W+'px',height:BAR_H+'px',background:barBackground,zIndex:'1',pointerEvents:'none'});pad.appendChild(d);}

  const diskCX=LS?Math.round(COL_W/2):Math.round(W*0.25);
  const diskCY=LS?Math.round(H*0.58):Math.round(BAR_Y+BAR_H*0.52);
  const faceCX=LS?Math.round(W-COL_W/2):Math.round(W*0.75);
  const faceCY=diskCY, shY=LS?MAR:BAR_Y+MAR;
  const metaCY=LS?Math.round(H/2-MH/2):Math.round(BAR_Y+BAR_H*0.12);
  const OFF=BS+GAP;
  const FPOS=[{dx:-OFF,dy:0},{dx:0,dy:-OFF},{dx:OFF,dy:0},{dx:0,dy:OFF}];

  function mkEl(c,s){const e=document.createElement('div');e.className=c;Object.assign(e.style,{position:'absolute',zIndex:'5'},s);return e;}
  function makeBtn(f,cx,cy,sz){sz=Math.max(sz,34);const e=mkEl('rv-btn',{width:sz+'px',height:sz+'px',left:(cx-sz/2)+'px',top:(cy-sz/2)+'px',fontSize:(f.fontSize||Math.round(sz*0.42))+'px',color:'#fff',background:f.color,border:`2.5px solid ${f.border}`,boxShadow:`0 0 18px ${f.glow||f.border+'99'}, 0 4px 14px rgba(0,0,0,.75)`,opacity:'.97'});e.textContent=f.label;bindBtn(e,f.input);return e;}
  function makeShoulder(sh,x,y){const lx=LS&&sh.side==='right'?W-MAR-SW:(LS?MAR:x);const e=mkEl('rv-shoulder',{width:SW+'px',height:SH+'px',left:(LS?lx:x)+'px',top:y+'px',fontSize:Math.round(SH*0.52)+'px',color:'#fff',background:sh.color,border:`1.5px solid ${sh.border}`,boxShadow:`0 0 12px ${sh.glow}`,opacity:'.95',borderRadius:sh.side==='right'?'10px 4px 4px 10px':'4px 10px 10px 4px'});e.textContent=sh.label;bindBtn(e,sh.input);return e;}
  function makeMeta(m,cx,cy,w,h){const e=mkEl('rv-meta',{width:w+'px',height:h+'px',left:(cx-w/2)+'px',top:(cy-h/2)+'px',fontSize:Math.round(h*0.5)+'px',color:m.textColor||'rgba(255,255,255,0.7)',background:m.color,border:`1px solid ${m.border}`,borderRadius:'20px',opacity:'.92'});e.textContent=m.label;bindBtn(e,m.input);return e;}
  function bindBtn(e,id){e.addEventListener('touchstart',ev=>{ev.preventDefault();e.classList.add('pressed');sendInput(id,1);},{passive:false});e.addEventListener('touchend',ev=>{ev.preventDefault();e.classList.remove('pressed');sendInput(id,0);},{passive:false});e.addEventListener('touchcancel',ev=>{ev.preventDefault();e.classList.remove('pressed');sendInput(id,0);},{passive:false});e.addEventListener('mousedown',()=>{e.classList.add('pressed');sendInput(id,1);});e.addEventListener('mouseup',()=>{e.classList.remove('pressed');sendInput(id,0);});}

  function makeDpad(color,border,cx,cy,size){
    const wrap=mkEl('',{width:size+'px',height:size+'px',left:(cx-size/2)+'px',top:(cy-size/2)+'px',touchAction:'none',pointerEvents:'auto',zIndex:'6',borderRadius:'50%',background:skin.diskBg,border:`2px solid ${skin.diskBorder||border+'44'}`,boxShadow:'0 4px 20px rgba(0,0,0,.5)'});wrap.id='rv-dpad';
    const inner=Math.round(size*0.75),offset=Math.round((size-inner)/2);
    const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 90 90');svg.setAttribute('width',inner);svg.setAttribute('height',inner);svg.style.cssText=`position:absolute;top:${offset}px;left:${offset}px;pointer-events:none;`;
    svg.innerHTML=`<g filter="drop-shadow(0 2px 8px rgba(0,0,0,.9))"><rect x="27" y="5" width="36" height="80" rx="10" fill="${color}" stroke="${border}" stroke-width="2.5"/><rect x="5" y="27" width="80" height="36" rx="10" fill="${color}" stroke="${border}" stroke-width="2.5"/><rect x="27" y="27" width="36" height="36" rx="5" fill="${color}"/><polygon points="45,11 54,26 36,26" fill="${border}" opacity=".95"/><polygon points="45,79 54,64 36,64" fill="${border}" opacity=".95"/><polygon points="11,45 26,54 26,36" fill="${border}" opacity=".95"/><polygon points="79,45 64,54 64,36" fill="${border}" opacity=".95"/></g>`;
    wrap.appendChild(svg);
    const DIRS=[{up:1,left:1},{up:1},{up:1,right:1},{left:1},{},{right:1},{down:1,left:1},{down:1},{down:1,right:1}];
    const st={up:0,down:0,left:0,right:0};const ID={up:EJS_INPUT.UP,down:EJS_INPUT.DOWN,left:EJS_INPUT.LEFT,right:EJS_INPUT.RIGHT};
    function upd(ns){for(const d in st)if(ns[d]!==st[d]){sendInput(ID[d],ns[d]);st[d]=ns[d];}}
    function fp(px2,py2){const r=wrap.getBoundingClientRect(),s3=r.width/3;const i=Math.max(0,Math.min(8,Math.floor((py2-r.top)/s3)*3+Math.floor((px2-r.left)/s3)));const d=DIRS[i];return{up:d.up?1:0,down:d.down?1:0,left:d.left?1:0,right:d.right?1:0};}
    const clr=()=>upd({up:0,down:0,left:0,right:0});
    wrap.addEventListener('touchstart',e=>{e.preventDefault();upd(fp(e.touches[0].clientX,e.touches[0].clientY));},{passive:false});
    wrap.addEventListener('touchmove',e=>{e.preventDefault();upd(fp(e.touches[0].clientX,e.touches[0].clientY));},{passive:false});
    wrap.addEventListener('touchend',e=>{e.preventDefault();clr();},{passive:false});
    wrap.addEventListener('touchcancel',e=>{e.preventDefault();clr();},{passive:false});
    return wrap;
  }

  function makeAnalog(color,border,cx,cy,size){

/* ═══════════════════════════════════════════
   SCREENSHOT
═══════════════════════════════════════════ */
function takeScreenshot() {
  try {
    const canvas = document.querySelector('#game canvas');
    if (!canvas) { showToast('⚠️ Nenhum jogo ativo'); return; }
    const dataUrl = canvas.toDataURL('image/png');
    // Download
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = `retroverso_${core}_${Date.now()}.png`;
    a.click();
    // Salva nas conquistas
    try {
      let screenshots = JSON.parse(localStorage.getItem('rv_screenshots') || '0');
      screenshots = (typeof screenshots === 'number' ? screenshots : 0) + 1;
      localStorage.setItem('rv_screenshots', JSON.stringify(screenshots));
      checkAchievements();
    } catch(e) {}
    showToast('📸 Screenshot salvo!');
  } catch(e) {
    showToast('⚠️ Erro ao capturar tela');
  }
}

/* ═══════════════════════════════════════════
   THEATER MODE
═══════════════════════════════════════════ */
let theaterMode = false;

function applyTheaterMode() {
  document.body.classList.toggle('theater-mode', theaterMode);

  const button = document.getElementById('rv-theater-btn');
  if (button) {
    button.setAttribute('aria-pressed', String(theaterMode));
    button.title = theaterMode ? 'Sair do modo Theater' : 'Modo Theater';
  }
}

function toggleTheater() {
  theaterMode = !theaterMode;
  applyTheaterMode();
  // A região touch da tela inferior do NDS precisa seguir o novo tamanho.
  setTimeout(() => { if (typeof window.RV_SYNC_NDS_STYLUS === 'function') window.RV_SYNC_NDS_STYLUS(); }, 100);
  showToast(theaterMode ? 'Modo Theater ativado — controles ocultos' : 'Modo Theater desativado');
}

// ESC também fecha o modo imersivo, sem interferir no menu de cheats.
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && theaterMode && !document.body.classList.contains('rv-cheats-open')) {
    theaterMode = false;
    applyTheaterMode();
    showToast('🎬 Modo Theater desativado');
  }
});

/* ═══════════════════════════════════════════
   TOAST NOTIFICATION
═══════════════════════════════════════════ */
let toastTimeout;
function showToast(msg) {
  const toast = document.getElementById('rv-toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toast.classList.remove('show'), 2500);
}

/* ═══════════════════════════════════════════
   ACHIEVEMENTS (Conquistas)
═══════════════════════════════════════════ */
function trackAchievements(consoleKey, gameName) {
  try {
    // Jogos únicos jogados
    let playedGames = JSON.parse(localStorage.getItem('rv_played_games') || '[]');
    const gameId = consoleKey + '/' + gameName;
    if (!playedGames.includes(gameId)) {
      playedGames.push(gameId);
      localStorage.setItem('rv_played_games', JSON.stringify(playedGames));
    }
    // Total de sessões
    let sessions = JSON.parse(localStorage.getItem('rv_sessions') || '0');
    sessions = (typeof sessions === 'number' ? sessions : 0) + 1;
    localStorage.setItem('rv_sessions', JSON.stringify(sessions));
    // Consoles únicos
    let consoles = JSON.parse(localStorage.getItem('rv_consoles_played') || '[]');
    if (!consoles.includes(consoleKey)) {
      consoles.push(consoleKey);
      localStorage.setItem('rv_consoles_played', JSON.stringify(consoles));
    }
    checkAchievements();
  } catch(e) {}
}

function checkAchievements() {
  try {
    const achievements = JSON.parse(localStorage.getItem('rv_achievements') || '{}');
    const playedGames = JSON.parse(localStorage.getItem('rv_played_games') || '[]');
    const sessions = JSON.parse(localStorage.getItem('rv_sessions') || '0');
    const consoles = JSON.parse(localStorage.getItem('rv_consoles_played') || '[]');
    const favorites = JSON.parse(localStorage.getItem('rv_favorites') || '[]');
    const screenshots = JSON.parse(localStorage.getItem('rv_screenshots') || '0');
    let newAchievements = [];

    const defs = [
      { id: 'first_game', name: 'Primeira Aventura', desc: 'Abra seu primeiro jogo', check: () => sessions >= 1 },
      { id: 'five_games', name: 'Explorador', desc: 'Jogue 5 jogos diferentes', check: () => playedGames.length >= 5 },
      { id: 'ten_games', name: 'Veterano', desc: 'Jogue 10 jogos diferentes', check: () => playedGames.length >= 10 },
      { id: 'twenty_games', name: 'Lenda Retro', desc: 'Jogue 20 jogos diferentes', check: () => playedGames.length >= 20 },
      { id: 'three_consoles', name: 'Multiverso', desc: 'Jogue em 3 consoles diferentes', check: () => consoles.length >= 3 },
      { id: 'all_consoles', name: 'Mestre dos Mundos', desc: 'Jogue em todos os consoles', check: () => consoles.length >= 11 },
      { id: 'first_fav', name: 'Favorito!', desc: 'Favorite seu primeiro jogo', check: () => favorites.length >= 1 },
      { id: 'five_favs', name: 'Curador', desc: 'Favorite 5 jogos', check: () => favorites.length >= 5 },
      { id: 'ten_sessions', name: 'Dedicado', desc: 'Abra 10 sessões de jogo', check: () => sessions >= 10 },
      { id: 'fifty_sessions', name: 'Hardcore', desc: 'Abra 50 sessões de jogo', check: () => sessions >= 50 },
      { id: 'first_screenshot', name: 'Fotógrafo', desc: 'Tire seu primeiro screenshot', check: () => screenshots >= 1 },
      { id: 'ten_screenshots', name: 'Galeria', desc: 'Tire 10 screenshots', check: () => screenshots >= 10 },
    ];

    for (const def of defs) {
      if (!achievements[def.id] && def.check()) {
        achievements[def.id] = { name: def.name, desc: def.desc, date: Date.now() };
        newAchievements.push(def);
      }
    }

    if (newAchievements.length > 0) {
      localStorage.setItem('rv_achievements', JSON.stringify(achievements));
      for (const a of newAchievements) {
        showToast(`🏆 ${a.name}: ${a.desc}`);
      }
    }
  } catch(e) {}
}

/* Bind buttons */
document.getElementById('rv-screenshot-btn').addEventListener('click', takeScreenshot);
document.getElementById('rv-screenshot-btn').addEventListener('touchend', e => { e.preventDefault(); takeScreenshot(); }, {passive:false});
// O evento click também funciona em touch; manter um único listener evita
// ativar/desativar o modo duas vezes no celular.
document.getElementById('rv-theater-btn').addEventListener('click', toggleTheater);

/* Fullscreen */
function requestFS(){const el=document.documentElement;(el.requestFullscreen||el.webkitRequestFullscreen)?.call(el);}
// O botão some EM fullscreen e VOLTA ao sair (ESC, gesto ou chamada) —
// antes ele era escondido no clique e nunca mais reaparecia.
function syncFsBtnVisibility(){
  const btn=document.getElementById('rv-fs-btn');
  if(!btn) return;
  const inFs=!!(document.fullscreenElement||document.webkitFullscreenElement);
  btn.style.display = inFs ? 'none' : '';
}
['fullscreenchange','webkitfullscreenchange'].forEach(evt=>document.addEventListener(evt,syncFsBtnVisibility));
document.getElementById('rv-fs-btn').addEventListener('click',requestFS);
document.getElementById('rv-fs-btn').addEventListener('touchend',e=>{e.preventDefault();requestFS();},{passive:false});

/* ═══ HUD DE DIAGNÓSTICO DE TOQUES (?paddebug=1) ═══
   Mostra no canto da tela, em tempo real, cada input que o controle
   entrega ao núcleo. Serve para diagnosticar no CELULAR o que chega
   quando um botão é pressionado. Não interfere no jogo. */
(function initPadDebugHUD() {
  const viaUrl = /[?&]paddebug=1/.test(location.search);
  let viaPrefs = false;
  try { viaPrefs = localStorage.getItem('rv_paddebug') === '1'; } catch (e) { }
  if (!viaUrl && !viaPrefs) return;
  const hud = document.createElement('div');
  hud.id = 'rv-pad-hud';
  hud.style.cssText = [
    'position:fixed', 'top:calc(64px + env(safe-area-inset-top,0px))', 'left:8px',
    'z-index:9999', 'background:rgba(0,0,0,.82)', 'border:1px solid #00ff41',
    'border-radius:8px', 'color:#00ff41', "font:11px/1.6 'Courier New',monospace",
    'padding:7px 10px', 'max-width:64vw', 'pointer-events:none', 'white-space:pre-wrap',
    'text-shadow:0 0 6px rgba(0,255,65,.6)'
  ].join(';');
  hud.textContent = 'HUD-TOQUE: aguardando...';
  document.body.appendChild(hud);
  const linhas = [];
  window.__rvPadHUD = function (input, pressed) {
    linhas.push(input + (pressed ? ' ON' : ' off'));
    if (linhas.length > 8) linhas.shift();
    hud.textContent = 'HUD-TOQUE: ' + linhas.join(' | ');
  };
  window.addEventListener('touchstart', function once() {
    hud.textContent = 'HUD-TOQUE: touch ok, aguardando input...';
    window.removeEventListener('touchstart', once);
  });
})();

/* Resize/orientation */
window.addEventListener('orientationchange',()=>{setTimeout(()=>{if(isTouch)initControls();},350);});
window.addEventListener('resize',()=>{
  if(isTouch){
    const has=document.getElementById('rv-overlay').classList.contains('active')||document.getElementById('rv-pad').classList.contains('active');
    if(has) initControls();
  }
});
