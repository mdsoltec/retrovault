<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#03070a">
<title>RetroVerso — Entrar</title>
<link rel="icon" type="image/png" href="assets/rv-icon.png">
<!-- Mesmas famílias de css/style.css: Orbitron na marca, Rajdhani no resto. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Orbitron:wght@700;900&display=swap">
<link rel="apple-touch-icon" href="assets/rv-icon.png">
<link rel="manifest" href="manifest.json">

<!-- Conta/sessão. Precisa vir antes do script da página. -->
<script src="js/rv-config.js"></script>
<script src="js/rv-account.js"></script>

<style>
/* ═══════════════════════════════════════════════════════════
   RETROVERSO — TELA DE ENTRADA
   ───────────────────────────────────────────────────────────
   Nada aqui é decorativo por acaso:
   • fundo em <canvas> (grade em perspectiva + partículas) dá vida
     à tela sem pesar — 1 rAF, pausado quando a aba perde o foco;
   • o cartão responde ao ponteiro com uma inclinação 3D discreta;
   • as abas usam um indicador que desliza, e a troca de painel
     anima a altura do container (nada de "pulo" na interface);
   • tudo respeita prefers-reduced-motion.

   REGRA DESTA PÁGINA: nenhum texto de instrução/explicação vai
   para a tela. O que o jogador vê são rótulos e mensagens de
   resultado. Qualquer explicação fica em comentário, como este.
   ═══════════════════════════════════════════════════════════ */

*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }

:root{
  /* Espelha as variáveis de css/style.css para a porta de entrada ter a
     mesma cor do resto do site. Verde #00ff41 e azul #00bfff já existem
     lá (--green-neon e --nds-color); nada de tom novo. */
  --neon:#00ff41;
  --neon-soft:rgba(0,255,65,.55);
  --neon-dim:rgba(0,255,65,.16);
  --violet:#6b2fa0;
  --azul:#00bfff;
  --ink:#ffffff;
  --muted:#8e9e94;
  --bg:#030604;
  --card:rgba(9,14,11,.74);
  --font-display:'Orbitron','Segoe UI',Roboto,sans-serif;
  --danger:#ff6b6b;
  --radius:16px;   /* --radius de css/style.css */
  --borda:#1a261e; /* --border de css/style.css */
  --ease:cubic-bezier(.22,1,.36,1);
}

html,body{ height:100%; }
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Rajdhani','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:100dvh;
  padding:32px 18px calc(32px + env(safe-area-inset-bottom,0px));
  position:relative;
}

/* ── Fundo animado ────────────────────────────────────────── */
#rv-bg{ position:fixed; inset:0; width:100%; height:100%; z-index:0; display:block; }

/* Scanlines + vinheta: dão textura de CRT sem atrapalhar a leitura. */
.fx{ position:fixed; inset:0; z-index:1; pointer-events:none; }
.fx.lines{
  background-image:repeating-linear-gradient(0deg,
    rgba(255,255,255,.028) 0 1px, transparent 1px 3px);
  mix-blend-mode:overlay; opacity:.7;
}
.fx.vignette{
  background:radial-gradient(ellipse at 50% 42%, transparent 42%, rgba(0,0,0,.55) 78%, rgba(0,0,0,.85) 100%);
}

/* ── Marca ────────────────────────────────────────────────── */
.stage{
  position:relative; z-index:2; width:100%; max-width:430px;
  display:flex; flex-direction:column; align-items:center; gap:26px;
}

.brand{ display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center;
  animation:rise .8s var(--ease) both; }

/* Emblema fixo: nada gira nem pulsa aqui. A borda é um gradiente estático
   e o halo é um brilho constante — o movimento da tela fica no fundo. */
.logo-ring{
  position:relative; width:82px; height:82px; border-radius:24px;
  display:grid; place-items:center; isolation:isolate;
}
/* Mesmo desenho E mesmo movimento de .brand-logo (css/style.css): contorno
   de 2px que pulsa (logoPulseNav) e scanlines que descem (logoScanline).
   O que saiu daqui foi só o anel cônico girando, que não existe no site. */
.logo-ring::before{ content:none; }
.logo-ring::after{
  content:''; position:absolute; inset:-18px; border-radius:38px; z-index:-2;
  background:radial-gradient(circle, rgba(0,255,65,.16), transparent 72%);
}
.logo{
  position:relative; overflow:hidden;
  width:100%; height:100%; border-radius:20px; font-family:var(--font-display);
  border:2px solid var(--neon);
  background:linear-gradient(160deg,#07130d,#040807);
  display:grid; place-items:center;
  font-size:1.55rem; font-weight:900; letter-spacing:1px; color:var(--neon);
  animation:logoPulseNav 3s ease-in-out infinite;
}
.logo::after{
  content:''; position:absolute; inset:-4px 0; pointer-events:none;
  background:repeating-linear-gradient(0deg, transparent, transparent 2px,
    rgba(0,0,0,.15) 2px, rgba(0,0,0,.15) 4px);
  animation:logoScanline 4s linear infinite;
}
/* Copiados de css/style.css para a login não depender da folha do site. */
@keyframes logoPulseNav{
  0%,100%{ box-shadow:0 0 14px rgba(0,255,65,.4), inset 0 0 10px rgba(0,255,65,.06);
           text-shadow:0 0 8px var(--neon); }
  50%    { box-shadow:0 0 28px rgba(0,255,65,.4), 0 0 50px rgba(0,255,65,.15),
                      inset 0 0 18px rgba(0,255,65,.12);
           text-shadow:0 0 16px var(--neon); }
}
@keyframes logoScanline{ 0%{ transform:translateY(0); } 100%{ transform:translateY(4px); } }

.wordmark{
  font-family:var(--font-display);
  font-size:1.5rem; font-weight:900; letter-spacing:.34em; text-indent:.34em;
  background:linear-gradient(180deg,#fff,#8effc4);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  position:relative;
}
/* Glitch curtíssimo, a cada ~9s: sinal de "tela viva", não distrai. */
.wordmark::after{
  content:'RETROVERSO'; position:absolute; inset:0; color:var(--neon); opacity:0;
  clip-path:inset(42% 0 38% 0); animation:glitch 9s steps(1) infinite;
}
.tagline{ font-size:.66rem; letter-spacing:.3em; color:var(--muted); text-transform:uppercase; }

/* ── Cartão ───────────────────────────────────────────────── */
.card{
  position:relative; width:100%; padding:24px 22px 22px;
  background:var(--card);
  border:1px solid rgba(0,255,65,.22);
  border-radius:var(--radius);
  backdrop-filter:blur(14px) saturate(140%);
  -webkit-backdrop-filter:blur(14px) saturate(140%);
  box-shadow:0 26px 70px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.05);
  transform-style:preserve-3d;
  transition:transform .35s var(--ease), opacity .35s var(--ease);
  animation:rise .9s .08s var(--ease) both;
}
/* Fio de luz correndo na borda superior. */
.card::before{
  content:''; position:absolute; top:-1px; left:12%; right:12%; height:1px;
  background:linear-gradient(90deg,transparent,var(--neon),transparent);
  opacity:.85; animation:sweep 4.6s ease-in-out infinite;
}
.card.leaving{ transform:scale(.96) translateY(-6px); opacity:0; }

/* Indicador discreto do modo de sessão (verde = nuvem, âmbar = aparelho). */
.status-dot{
  position:absolute; top:16px; right:16px; width:7px; height:7px; border-radius:50%;
  background:var(--neon); box-shadow:0 0 0 0 rgba(0,255,65,.55);
  animation:pulse 2.6s ease-out infinite;
}
.status-dot.local{ background:#ffc65c; box-shadow:0 0 0 0 rgba(255,198,92,.5); animation-name:pulse-amber; }

/* ── Abas ─────────────────────────────────────────────────── */
.tabs{
  position:relative; display:flex; gap:2px; padding:4px;
  background:rgba(0,0,0,.42); border-radius:12px; margin-bottom:26px;
  border:1px solid rgba(255,255,255,.04);
}
/* As três formas de entrar ficam sempre à vista. Sem Firebase configurado,
   as de nuvem continuam clicáveis e respondem com um aviso ao enviar —
   esconder as abas fazia parecer que o site só tinha perfil local. */
.tab-indicator{
  position:absolute; top:4px; bottom:4px; left:0; width:0;
  background:linear-gradient(180deg, rgba(0,255,65,.22), rgba(0,255,65,.12));
  border:1px solid rgba(0,255,65,.35); border-radius:9px;
  transition:transform .38s var(--ease), width .38s var(--ease);
  pointer-events:none;
}
.tab{
  position:relative; flex:1; padding:10px 6px; border:0; background:transparent;
  color:#75907f; font-family:inherit; font-size:.7rem; font-weight:800;
  letter-spacing:.14em; text-transform:uppercase; cursor:pointer;
  transition:color .28s var(--ease); border-radius:9px;
}
.tab:hover{ color:#a9c9b6; }
.tab[aria-selected="true"]{ color:var(--neon); }

/* ── Painéis ──────────────────────────────────────────────── */
/* overflow:hidden impede que o conteúdo escape do cartão enquanto a altura
   anima. O padding (compensado pela margem negativa) devolve o espaço que
   sombras e foco precisam para não serem cortados. */
.panes{ position:relative; overflow:hidden; margin:-6px; padding:6px;
  transition:height .4s var(--ease); }
.pane{
  position:absolute; top:0; left:0; right:0;
  display:flex; flex-direction:column; gap:13px;
  opacity:0; transform:translateY(10px); pointer-events:none;
  transition:opacity .34s var(--ease), transform .34s var(--ease);
}
.pane.active{ position:relative; opacity:1; transform:none; pointer-events:auto; }

/* ── Campos com rótulo flutuante ──────────────────────────── */
.field{ position:relative; }
.field input{
  width:100%; height:52px; padding:20px 44px 8px 42px;
  background:rgba(0,0,0,.45); color:var(--ink);
  border:1px solid rgba(255,255,255,.09); border-radius:11px;
  font-family:inherit; font-size:1.02rem; font-weight:600; outline:none;
  transition:border-color .25s var(--ease), box-shadow .25s var(--ease), background .25s var(--ease);
}
.field input:hover{ border-color:rgba(0,255,65,.28); }
.field input:focus{
  border-color:var(--neon); background:rgba(0,20,10,.55);
  box-shadow:inset 0 0 0 1px rgba(0,255,65,.45), inset 0 8px 22px rgba(0,255,65,.07);
}
.field input:-webkit-autofill{ -webkit-text-fill-color:var(--ink); -webkit-box-shadow:0 0 0 40px #071009 inset; }
.field label{
  position:absolute; left:42px; top:50%; transform:translateY(-50%);
  color:var(--muted); font-size:.9rem; pointer-events:none;
  transition:transform .24s var(--ease), font-size .24s var(--ease), color .24s var(--ease);
  transform-origin:left center;
}
.field input:focus + label,
.field input:not(:placeholder-shown) + label{
  transform:translateY(-20px) scale(.74); color:var(--neon-soft);
  letter-spacing:.09em; text-transform:uppercase;
}
.field .ico{
  position:absolute; left:14px; top:50%; transform:translateY(-50%);
  width:17px; height:17px; fill:none; stroke:var(--muted); stroke-width:1.9;
  stroke-linecap:round; stroke-linejoin:round; pointer-events:none;
  transition:stroke .25s var(--ease);
}
.field input:focus ~ .ico{ stroke:var(--neon); }
.field .peek{
  position:absolute; right:8px; top:50%; transform:translateY(-50%);
  width:32px; height:32px; display:grid; place-items:center;
  background:none; border:0; cursor:pointer; border-radius:8px; color:var(--muted);
  transition:color .2s var(--ease), background .2s var(--ease);
}
.field .peek:hover{ color:var(--neon); background:rgba(0,255,65,.08); }
.field .peek svg{ width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.9; }
.row{ display:flex; gap:11px; }
.row > *{ flex:1; }

/* PIN com cara de código, não de senha comum. */
input.code{ text-align:center; letter-spacing:.7em; text-indent:.7em;
  font-family:'Courier New',monospace; font-size:1.1rem; padding-left:42px; }

/* ── Botões ───────────────────────────────────────────────── */
.btn{
  position:relative; overflow:hidden; height:50px; margin-top:4px;
  border:0; border-radius:11px; cursor:pointer; font-family:inherit;
  font-size:.8rem; font-weight:900; letter-spacing:.14em; text-transform:uppercase;
  display:grid; place-items:center;
  transition:transform .2s var(--ease), box-shadow .3s var(--ease), filter .25s var(--ease);
}
.btn.solid{
  background:linear-gradient(135deg,#00ff41,#00b85a 55%,#00bfff);
  background-size:180% 180%; color:#02150b;
  box-shadow:0 10px 26px rgba(0,255,65,.22);
  animation:shift 7s ease infinite;
}
.btn.solid:hover{ transform:translateY(-2px); box-shadow:0 16px 34px rgba(0,255,65,.32); }
.btn.solid:active{ transform:translateY(0) scale(.99); }
.btn.outline{
  background:rgba(0,255,65,.05); color:var(--neon);
  border:1px solid rgba(0,255,65,.3);
}
.btn.outline:hover{ background:rgba(0,255,65,.13); border-color:var(--neon); }
.btn:disabled{ cursor:progress; filter:saturate(.5) brightness(.85); transform:none; }
.btn .label{ display:flex; align-items:center; gap:9px; }
.btn .spin{
  width:15px; height:15px; border-radius:50%; display:none;
  border:2px solid rgba(2,21,11,.28); border-top-color:#02150b;
  animation:spin .7s linear infinite;
}
.btn.outline .spin{ border-color:rgba(0,255,65,.25); border-top-color:var(--neon); }

/* Entrar com Google: botão claro, contraste alto, logo oficial em SVG. */
.btn.google{
  background:#fff; color:#1f2328; border:1px solid rgba(255,255,255,.9);
  font-weight:800; letter-spacing:.06em; text-transform:none; font-size:.86rem;
}
.btn.google:hover:not(:disabled){ background:#f1f3f5; box-shadow:0 8px 24px rgba(255,255,255,.14); }
.btn.google .label{ gap:11px; }
.btn.google svg{ width:19px; height:19px; flex:none; }
.btn.google .spin{ border-color:rgba(0,0,0,.18); border-top-color:#1f2328; }

.or{
  display:flex; align-items:center; gap:12px; margin:19px 0 15px;
  font-size:.58rem; letter-spacing:.22em; text-transform:uppercase;
  color:rgba(255,255,255,.28);
}
.or::before, .or::after{
  content:''; flex:1; height:1px;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.15), transparent);
}
.btn.loading .spin{ display:block; }
/* Brilho que atravessa o botão no hover. */
.btn.solid::after{
  content:''; position:absolute; top:0; left:-60%; width:35%; height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);
  transform:skewX(-20deg); transition:left .6s var(--ease);
}
.btn.solid:hover::after{ left:130%; }

.link{
  align-self:center; margin-top:2px; padding:6px 8px;
  background:none; border:0; cursor:pointer; font-family:inherit;
  color:var(--muted); font-size:.72rem; letter-spacing:.03em;
  transition:color .22s var(--ease);
}
.link:hover{ color:var(--neon); }

/* ── Mensagem de resultado ────────────────────────────────── */
.msg{
  overflow:hidden; max-height:0; opacity:0; margin-top:0;
  border-radius:10px; font-size:.8rem; line-height:1.5;
  transition:max-height .35s var(--ease), opacity .3s var(--ease), margin-top .3s var(--ease);
}
.msg.show{ max-height:130px; opacity:1; margin-top:20px; }
.msg .inner{ padding:11px 13px; border:1px solid transparent; border-radius:10px; display:flex; gap:9px; }
.msg.err .inner{ background:rgba(255,70,70,.09); border-color:rgba(255,90,90,.4); color:#ffb1b1; }
.msg.ok .inner{ background:rgba(0,255,65,.08); border-color:rgba(0,255,65,.4); color:var(--neon); }

/* ── Perfis do aparelho ───────────────────────────────────── */
.profiles{ display:flex; flex-direction:column; gap:8px; }
.profile{
  position:relative; display:flex; align-items:center; gap:12px;
  padding:11px 12px; border-radius:12px; cursor:pointer; text-align:left;
  background:rgba(255,255,255,.028); border:1px solid rgba(255,255,255,.06);
  font-family:inherit; color:inherit; width:100%;
  transition:transform .25s var(--ease), background .25s var(--ease), border-color .25s var(--ease);
  animation:rise .45s var(--ease) both;
}
.profile:hover{ transform:translateX(4px); background:rgba(0,255,65,.08); border-color:rgba(0,255,65,.32); }
.profile[aria-pressed="true"]{ background:rgba(0,255,65,.13); border-color:var(--neon); }
.avatar{
  width:38px; height:38px; border-radius:11px; flex-shrink:0; display:grid; place-items:center;
  overflow:hidden; background-size:cover; background-position:center;
  font-weight:900; font-size:.84rem; color:#02150b;
  background:linear-gradient(140deg,var(--neon),#00b0ff);
  box-shadow:0 4px 14px rgba(0,255,65,.22);
}
.avatar{ position:relative; cursor:pointer; }
.avatar:hover::after{ content:'✎'; position:absolute; inset:0; display:grid; place-items:center; color:#fff; background:rgba(0,0,0,.55); font-size:.9rem; }
.inline-avatar-picker{ position:absolute; z-index:8; left:10px; top:58px; display:flex; flex-wrap:wrap; gap:5px; width:190px; padding:8px; border:1px solid rgba(0,255,65,.35); border-radius:10px; background:#090e0b; box-shadow:0 10px 25px rgba(0,0,0,.45),0 0 18px rgba(0,255,65,.12); }
.inline-avatar-picker button{ width:30px; height:30px; padding:0; overflow:hidden; border:1px solid rgba(255,255,255,.14); border-radius:7px; background:#030604; color:var(--neon); cursor:pointer; font:900 .52rem var(--font-display); }
.inline-avatar-picker button:hover,.inline-avatar-picker button.selected{ border-color:var(--neon); box-shadow:0 0 8px var(--green-glow); }
.inline-avatar-picker img{ width:100%; height:100%; object-fit:cover; display:block; }
.p-meta{ flex:1; min-width:0; }
.p-name{ font-size:.94rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.p-sub{ font-size:.65rem; color:var(--muted); letter-spacing:.06em; margin-top:2px; text-transform:uppercase; }
.p-del{
  width:28px; height:28px; border:0; border-radius:8px; background:none; cursor:pointer;
  color:#5d6f64; display:grid; place-items:center; flex-shrink:0;
  transition:color .2s var(--ease), background .2s var(--ease);
}
.p-del:hover{ color:var(--danger); background:rgba(255,90,90,.1); }
.p-del svg{ width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; }
.empty{ padding:16px 4px; text-align:center; color:var(--muted); font-size:.8rem; }
.new-avatar-label{ display:block; margin:13px 0 7px; color:var(--muted); font-size:.62rem; letter-spacing:.16em; text-transform:uppercase; }
.new-avatar-options{ display:flex; gap:7px; flex-wrap:wrap; }
.new-avatar-option{ width:34px; height:34px; padding:0; overflow:hidden; border:1px solid rgba(255,255,255,.13); border-radius:9px; background:#090e0b; cursor:pointer; transition:transform .2s,border-color .2s,box-shadow .2s; }
.new-avatar-option:hover,.new-avatar-option.selected{ border-color:var(--neon); box-shadow:0 0 10px var(--green-glow); transform:translateY(-2px); }
.new-avatar-option img{ width:100%; height:100%; object-fit:cover; display:block; }
.new-avatar-option.none{ color:var(--neon); font:900 .6rem var(--font-display); }


.sep{
  display:flex; align-items:center; gap:11px; margin:16px 0 12px;
  color:#4d685a; font-size:.6rem; letter-spacing:.24em; text-transform:uppercase;
}
.sep::before,.sep::after{ content:''; flex:1; height:1px; background:linear-gradient(90deg,transparent,rgba(0,255,65,.2),transparent); }

.collapse{ display:grid; grid-template-rows:0fr; transition:grid-template-rows .4s var(--ease), opacity .3s var(--ease); opacity:0; }
.collapse.open{ grid-template-rows:1fr; opacity:1; }
.collapse > div{ overflow:hidden; display:flex; flex-direction:column; gap:11px; }

.foot{ position:relative; z-index:2; margin-top:26px; font-size:.6rem; letter-spacing:.24em;
  color:#33493d; text-transform:uppercase; animation:rise 1s .2s var(--ease) both; }

/* ── Animações ────────────────────────────────────────────── */
@keyframes spin{ to{ transform:rotate(360deg); } }
@keyframes breathe{ 0%,100%{ opacity:.45; transform:scale(.95); } 50%{ opacity:.9; transform:scale(1.06); } }
@keyframes rise{ from{ opacity:0; transform:translateY(16px); } to{ opacity:1; transform:none; } }
@keyframes sweep{ 0%,100%{ opacity:.15; } 50%{ opacity:1; } }
@keyframes shift{ 0%,100%{ background-position:0% 50%; } 50%{ background-position:100% 50%; } }
@keyframes pulse{
  0%{ box-shadow:0 0 0 0 rgba(0,255,65,.5); } 70%{ box-shadow:0 0 0 8px rgba(0,255,65,0); } 100%{ box-shadow:0 0 0 0 rgba(0,255,65,0); }
}
@keyframes pulse-amber{
  0%{ box-shadow:0 0 0 0 rgba(255,198,92,.5); } 70%{ box-shadow:0 0 0 8px rgba(255,198,92,0); } 100%{ box-shadow:0 0 0 0 rgba(255,198,92,0); }
}
@keyframes glitch{
  0%,96%{ opacity:0; transform:none; }
  96.5%{ opacity:.9; transform:translateX(-3px); }
  97.5%{ opacity:.9; transform:translateX(3px); }
  98.5%{ opacity:0; transform:none; }
}

/* Acessibilidade: quem pediu menos movimento recebe a versão calma. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation:none !important; transition-duration:.01ms !important; }
}

@media (max-width:480px){
  .wordmark{ font-size:1.32rem; letter-spacing:.3em; text-indent:.3em; }
  .tagline{ font-size:.58rem; letter-spacing:.18em; }
  .card{ padding:20px 16px 18px; }
  .tab{ font-size:.62rem; letter-spacing:.09em; }
}
@media (max-height:640px){

<script>
/* ═══════════════════════════════════════════════════════════
   FUNDO ANIMADO
   Grade em perspectiva correndo até o horizonte + partículas
   subindo. Um único requestAnimationFrame, pausado quando a aba
   sai de foco. Se o canvas não estiver disponível (ou o jogador
   pedir menos movimento), a tela simplesmente fica estática.
   ═══════════════════════════════════════════════════════════ */
(function background() {
  var canvas = document.getElementById('rv-bg');
  var ctx = canvas && canvas.getContext && canvas.getContext('2d');
  if (!ctx) return;

  var calm = false;
  try { calm = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { }

  var W = 0, H = 0, dpr = 1, horizon = 0, particles = [], t = 0, raf = null;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.width = Math.floor(innerWidth * dpr);
    H = canvas.height = Math.floor(innerHeight * dpr);
    canvas.style.width = innerWidth + 'px';
    canvas.style.height = innerHeight + 'px';
    horizon = H * 0.58;
    // Densidade proporcional à área, com teto para não pesar em telas grandes.
    var alvo = Math.min(46, Math.round((innerWidth * innerHeight) / 26000));
    particles = [];
    for (var i = 0; i < alvo; i++) particles.push(novaParticula(true));
    if (calm) draw(0);
  }

  function novaParticula(espalhar) {
    return {
      x: Math.random() * W,
      y: espalhar ? Math.random() * H : H + 10 * dpr,
      r: (Math.random() * 1.6 + 0.5) * dpr,
      v: (Math.random() * 0.22 + 0.07) * dpr,
      a: Math.random() * 0.4 + 0.12,
      w: Math.random() * Math.PI * 2
    };
  }

  function draw(now) {
    t = now * 0.001;

    // Céu
    var sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#03070a');
    sky.addColorStop(0.55, '#04100c');
    sky.addColorStop(1, '#010403');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    // Brilho no horizonte
    var glow = ctx.createRadialGradient(W / 2, horizon, 0, W / 2, horizon, W * 0.55);
    glow.addColorStop(0, 'rgba(0,255,65,.16)');
    glow.addColorStop(0.42, 'rgba(0,140,255,.05)');
    glow.addColorStop(1, 'transparent');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);

    ctx.lineWidth = Math.max(1, dpr * 0.8);

    // Linhas que fogem para o ponto de fuga
    var vx = W / 2, cols = 22;
    for (var i = -cols; i <= cols; i++) {
      var p = i / cols;
      ctx.strokeStyle = 'rgba(0,255,65,' + (0.16 - Math.abs(p) * 0.1).toFixed(3) + ')';
      ctx.beginPath();
      ctx.moveTo(vx, horizon);
      ctx.lineTo(vx + p * W * 2.4, H);
      ctx.stroke();
    }

    // Linhas horizontais acelerando na direção de quem olha
    var passo = 0.055, deslocamento = (t * 0.12) % passo;
    for (var k = 0; k < 20; k++) {
      var d = k * passo + deslocamento;
      if (d <= 0 || d >= 1.05) continue;
      var y = horizon + (H - horizon) * Math.pow(d, 2.35);
      if (y > H) continue;
      ctx.strokeStyle = 'rgba(0,255,65,' + (0.05 + d * 0.2).toFixed(3) + ')';
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }

    // Linha do horizonte
    ctx.strokeStyle = 'rgba(0,255,65,.42)';
    ctx.beginPath(); ctx.moveTo(0, horizon); ctx.lineTo(W, horizon); ctx.stroke();

    // Partículas
    for (var j = 0; j < particles.length; j++) {
      var s = particles[j];
      s.y -= s.v; s.w += 0.02;
      s.x += Math.sin(s.w) * 0.22 * dpr;
      if (s.y < -10 * dpr) particles[j] = novaParticula(false);
      ctx.fillStyle = 'rgba(0,255,65,' + s.a.toFixed(2) + ')';
      ctx.fillRect(s.x, s.y, s.r, s.r);
    }

    if (!calm) raf = requestAnimationFrame(draw);
  }

  addEventListener('resize', resize, { passive: true });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { cancelAnimationFrame(raf); raf = null; }
    else if (!raf && !calm) raf = requestAnimationFrame(draw);
  });

  resize();
  if (!calm) raf = requestAnimationFrame(draw);
})();

/* ═══════════════════════════════════════════════════════════
   INCLINAÇÃO 3D DO CARTÃO
   Só em ponteiro fino (mouse): no celular seria ruído.
   ═══════════════════════════════════════════════════════════ */
(function tilt() {
  var card = document.getElementById('card');
  var fino = false, calm = false;
  try {
    fino = matchMedia('(any-pointer: fine)').matches;
    calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  } catch (e) { }
  if (!card || !fino || calm) return;

  var alvoX = 0, alvoY = 0, atualX = 0, atualY = 0, ativo = false;

  addEventListener('pointermove', function (e) {
    var r = card.getBoundingClientRect();
    var dx = (e.clientX - (r.left + r.width / 2)) / (innerWidth / 2);
    var dy = (e.clientY - (r.top + r.height / 2)) / (innerHeight / 2);
    alvoX = Math.max(-1, Math.min(1, dy)) * -3.2;
    alvoY = Math.max(-1, Math.min(1, dx)) * 3.6;
    if (!ativo) { ativo = true; requestAnimationFrame(loop); }
  }, { passive: true });

  function loop() {
    atualX += (alvoX - atualX) * 0.08;
    atualY += (alvoY - atualY) * 0.08;
    card.style.transform = 'perspective(1000px) rotateX(' + atualX.toFixed(2) + 'deg) rotateY(' + atualY.toFixed(2) + 'deg)';
    if (Math.abs(alvoX - atualX) > 0.01 || Math.abs(alvoY - atualY) > 0.01) requestAnimationFrame(loop);
    else ativo = false;
  }
})();

/* ═══════════════════════════════════════════════════════════
   LÓGICA DA TELA
   ═══════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  /* Sem os scripts de conta (ex.: pré-visualização isolada do arquivo),
     a interface ainda é montada — só não autentica. */
  var TEM_CONTA = typeof window.RVAccount === 'object' && !!window.RVAccount;

  var params = new URLSearchParams(location.search);
  var next = params.get('next') || 'index.html';
  if (/^https?:/i.test(next) || !/^[\w.\-/?=&%#]+$/.test(next)) next = 'index.html';
  if (TEM_CONTA && RVAccount.isLogged() && !params.has('trocar')) { location.replace(next); return; }

  /* As abas continuam todas na tela mesmo sem Firebase; o que muda é qual
     delas abre primeiro e a resposta ao tentar usar a nuvem. */
  var NUVEM = TEM_CONTA && RVAccount.cloudConfigured;
  if (!NUVEM) {
    document.body.classList.add('no-cloud');
    document.getElementById('status-dot').classList.add('local');
    document.getElementById('status-dot').title = 'Perfis deste aparelho';
  } else {
    document.getElementById('status-dot').title = 'Sincronização na nuvem ativa';
  }

  var painelAtual = NUVEM ? 'entrar' : 'perfil';

  var panes = document.getElementById('panes');
  var indicator = document.getElementById('tab-indicator');
  var tabs = [].slice.call(document.querySelectorAll('.tab'));
  var msg = document.getElementById('msg');
  var msgText = document.getElementById('msg-text');

  /* ── Troca de painel com altura animada ── */
  function alturaDe(el) { return el.scrollHeight; }
  function ajustarAltura() {
    var ativo = document.getElementById('pane-' + painelAtual);
    if (!ativo) return;
    /* Se a medida vier zerada (fontes ainda carregando, aba oculta), cai em
       'auto': melhor perder a animação do que esconder o formulário. */
    var h = alturaDe(ativo);
    // +12 = padding vertical do container (6px em cima, 6px embaixo).
    panes.style.height = h > 0 ? (h + 12) + 'px' : 'auto';
  }

  /* O conteúdo muda de altura sozinho: PIN que abre, lista de perfis que
     recarrega, mensagem que aparece. O observador mantém o cartão do
     tamanho certo em todos esses casos, inclusive DURANTE as animações. */
  if (typeof ResizeObserver === 'function') {
    var observador = new ResizeObserver(function () { ajustarAltura(); });
    [].forEach.call(document.querySelectorAll('.pane'), function (el) { observador.observe(el); });
  } else {
    panes.style.overflow = 'visible';
  }
  function moverIndicador() {
    var botao = tabs.filter(function (b) { return b.dataset.pane === painelAtual; })[0];
    if (!botao) return;  /* antes havia um "&& NUVEM" aqui: com as abas
       escondidas o indicador nunca era posicionado, e agora que elas voltaram
       ele ficava encolhido na borda esquerda quando "Aparelho" abria primeiro. */
    indicator.style.width = botao.offsetWidth + 'px';
    indicator.style.transform = 'translateX(' + botao.offsetLeft + 'px)';
  }
  function abrirPainel(nome) {
    if (nome === painelAtual) return;
    var saindo = document.getElementById('pane-' + painelAtual);
    var entrando = document.getElementById('pane-' + nome);
    if (!entrando) return;
    panes.style.height = alturaDe(saindo) + 'px';
    saindo.classList.remove('active');
    entrando.classList.add('active');
    painelAtual = nome;
    esconderMensagem();
    requestAnimationFrame(function () { ajustarAltura(); moverIndicador(); });
    tabs.forEach(function (b) { b.setAttribute('aria-selected', String(b.dataset.pane === nome)); });
    var primeiro = entrando.querySelector('input');
    if (primeiro && matchMedia('(any-pointer: fine)').matches) setTimeout(function () { primeiro.focus(); }, 260);
  }
  tabs.forEach(function (b) { b.addEventListener('click', function () { abrirPainel(b.dataset.pane); }); });
  addEventListener('resize', function () { ajustarAltura(); moverIndicador(); }, { passive: true });
  addEventListener('load', function () { ajustarAltura(); moverIndicador(); });
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { ajustarAltura(); moverIndicador(); });
  }

  /* ── Mensagens ── */
  var msgTimer = null;
  function mostrarMensagem(texto, tipo) {
    clearTimeout(msgTimer);
    msgText.textContent = texto;
    msg.className = 'msg show ' + (tipo || 'err');
    requestAnimationFrame(ajustarAltura);
  }
  function esconderMensagem() { msg.className = 'msg'; }

  /* ── Estado de carregando nos botões ── */
  function ocupado(form, on) {
    var b = form.querySelector('button[type="submit"]');
    if (!b) return;
    b.disabled = on;
    b.classList.toggle('loading', on);
  }

  /* Aviso sem jargão quando a nuvem ainda não foi ligada em js/rv-config.js. */
  function exigeNuvem() {
    if (NUVEM) return false;
    mostrarMensagem('A conta na nuvem ainda não está ativa neste site. Use a aba Aparelho.');
    return true;
  }

  function concluir(nome) {
    mostrarMensagem('Tudo pronto, ' + nome + '.', 'ok');
    document.getElementById('card').classList.add('leaving');
    setTimeout(function () { location.replace(next); }, 520);
  }

  /* ── Mostrar/ocultar senha ── */
  document.querySelectorAll('.peek').forEach(function (b) {
    b.addEventListener('click', function () {
      var alvo = document.getElementById(b.dataset.peek);
      var visivel = alvo.type === 'text';
      alvo.type = visivel ? 'password' : 'text';
      b.setAttribute('aria-label', visivel ? 'Mostrar senha' : 'Ocultar senha');
      alvo.focus();
    });
  });

  /* ── Entrar (nuvem) ── */
  document.getElementById('pane-entrar').addEventListener('submit', async function (e) {
    e.preventDefault();
    if (!TEM_CONTA || exigeNuvem()) return;
    var email = document.getElementById('in-email').value.trim();
    var senha = document.getElementById('in-pass').value;
    if (!email || !senha) { mostrarMensagem('Preencha e-mail e senha.'); return; }
    esconderMensagem(); ocupado(this, true);
    try { concluir((await RVAccount.signIn(email, senha)).name || 'jogador'); }
    catch (err) { mostrarMensagem(err.message); ocupado(this, false); }
  });

  /* ── Criar conta (nuvem) ── */
  document.getElementById('pane-criar').addEventListener('submit', async function (e) {
    e.preventDefault();
    if (!TEM_CONTA || exigeNuvem()) return;
    var nome = document.getElementById('up-name').value.trim();
    var email = document.getElementById('up-email').value.trim();
    var senha = document.getElementById('up-pass').value;
    if (!nome) { mostrarMensagem('Escolha um nome de jogador.'); return; }
    if (senha.length < 6) { mostrarMensagem('A senha precisa de pelo menos 6 caracteres.'); return; }
    esconderMensagem(); ocupado(this, true);
    try {
      var s = await RVAccount.signUp(email, senha, nome);
      RVStore.setItem('rv_player_name', nome);
      concluir(s.name || nome);
    } catch (err) { mostrarMensagem(err.message); ocupado(this, false); }
  });

  /* ── Entrar com Google (janela pop-up do Firebase Auth) ── */
  [].forEach.call(document.querySelectorAll('[data-google]'), function (b) {
    b.addEventListener('click', async function () {
      if (!TEM_CONTA || exigeNuvem()) return;
      esconderMensagem();
      b.disabled = true; b.classList.add('loading');
      try {
        var s = await RVAccount.signInWithGoogle();
        concluir(s.name || 'jogador');
      } catch (err) {
        mostrarMensagem(err.message);
        b.disabled = false; b.classList.remove('loading');
      }
    });
  });

  /* ── Recuperar senha ── */
  document.getElementById('btn-reset').addEventListener('click', async function () {
    if (!TEM_CONTA || exigeNuvem()) return;
    var email = document.getElementById('in-email').value.trim();
    if (!email) { mostrarMensagem('Informe seu e-mail para receber o link.'); document.getElementById('in-email').focus(); return; }
    try { await RVAccount.resetPassword(email); mostrarMensagem('Link de redefinição enviado para ' + email + '.', 'ok'); }
    catch (err) { mostrarMensagem(err.message); }
  });

  /* ── Perfis deste aparelho ── */
  var selecionado = null;
  var lista = document.getElementById('profiles-list');
  var pinBox = document.getElementById('pin-collapse');
  var pinInput = document.getElementById('pin-input');

  function iniciais(nome) {
    var p = String(nome || '').trim().split(/\s+/).filter(Boolean);
    if (!p.length) return 'RV';
    return ((p[0][0] || '') + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase();
  }

  function renderPerfis() {
    var perfis = TEM_CONTA ? RVAccount.localProfiles() : [];
    lista.innerHTML = '';
    if (!perfis.length) {
      var vazio = document.createElement('div');
      vazio.className = 'empty';
      vazio.textContent = 'Nenhum perfil por aqui ainda.';
      lista.appendChild(vazio);
      pinBox.classList.remove('open');
      requestAnimationFrame(ajustarAltura);
      return;
    }
    perfis.forEach(function (p, i) {
      var item = document.createElement('button');
      item.type = 'button';
      item.className = 'profile';
      item.style.animationDelay = (i * 55) + 'ms';
      item.setAttribute('aria-pressed', String(selecionado === p.uid));

      var av = document.createElement('div');
      av.className = 'avatar';
      if (p.avatar) { av.style.backgroundImage = 'url(\"' + p.avatar.replace(/\"/g, '') + '\")'; av.textContent = ''; }
      else av.textContent = iniciais(p.name);
      av.title = 'Alterar avatar de ' + p.name;
      av.addEventListener('click', function (ev) {
        ev.stopPropagation();
        var oldPicker = item.querySelector('.inline-avatar-picker');
        if (oldPicker) { oldPicker.remove(); return; }
        var picker = document.createElement('div'); picker.className = 'inline-avatar-picker';
        AVATARES.forEach(function (choice) {
          var choiceBtn = document.createElement('button'); choiceBtn.type = 'button'; choiceBtn.title = choice.name;
          if (choice.id === (p.avatar || '')) choiceBtn.classList.add('selected');
          if (choice.id) { var image = document.createElement('img'); image.src = choice.id; image.alt = choice.name; choiceBtn.appendChild(image); }
          else choiceBtn.textContent = 'RV';
          choiceBtn.addEventListener('click', function (click) {
            click.stopPropagation();
            RVAccount.updateLocalProfile(p.uid, { avatar: choice.id });
            if (selecionado === p.uid) RVStore.setItem('rv_avatar', choice.id);
            renderPerfis();
          });
          picker.appendChild(choiceBtn);
        });
        item.appendChild(picker);
      });

      var meta = document.createElement('div');
      meta.className = 'p-meta';
      var nome = document.createElement('div');
      nome.className = 'p-name'; nome.textContent = p.name;
      var sub = document.createElement('div');
      sub.className = 'p-sub';
      sub.textContent = (p.pin ? 'PIN' : 'Livre') + ' · ' + new Date(p.createdAt).toLocaleDateString('pt-BR');
      meta.appendChild(nome); meta.appendChild(sub);

      var del = document.createElement('button');
      del.type = 'button'; del.className = 'p-del';
      del.setAttribute('aria-label', 'Apagar perfil de ' + p.name);
      del.innerHTML = '<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M6.5 7l1 13h9l1-13"/></svg>';
      del.addEventListener('click', function (ev) {
        ev.stopPropagation();
        if (!confirm('Apagar o perfil "' + p.name + '" e todo o histórico dele neste aparelho?')) return;
        RVAccount.deleteLocalProfile(p.uid);
        if (selecionado === p.uid) { selecionado = null; pinBox.classList.remove('open'); }
        renderPerfis();
      });

      item.appendChild(av); item.appendChild(meta); item.appendChild(del);
      item.addEventListener('click', function () {
        selecionado = p.uid;
        esconderMensagem();
        [].forEach.call(lista.children, function (n) { if (n.setAttribute) n.setAttribute('aria-pressed', 'false'); });
        item.setAttribute('aria-pressed', 'true');
        if (p.pin) {
          pinBox.classList.add('open');
          pinInput.value = '';
          requestAnimationFrame(function () { ajustarAltura(); setTimeout(function () { pinInput.focus(); }, 220); });
        } else {
          pinBox.classList.remove('open');
          entrarLocal();
        }
      });
      lista.appendChild(item);
    });
    requestAnimationFrame(ajustarAltura);
  }

  async function entrarLocal() {
    if (!TEM_CONTA || !selecionado) return;
    var form = document.getElementById('form-pin');
    esconderMensagem(); ocupado(form, true);
    try { concluir((await RVAccount.signInLocal(selecionado, pinInput.value)).name); }
    catch (err) { mostrarMensagem(err.message); ocupado(form, false); pinInput.select(); }
  }

  document.getElementById('form-pin').addEventListener('submit', function (e) { e.preventDefault(); entrarLocal(); });

  /* Avatares disponíveis também durante a criação do perfil. As artes são capas locais do catálogo. */
  var AVATARES = [
    { id: '', name: 'RV' },
    { id: 'covers/snes/Super Mario World (USA).png', name: 'Mario' },
    { id: 'covers/snes/Legend of Zelda, The - A Link to the Past (USA).png', name: 'Link' },
    { id: 'covers/gamegear/Sonic The Hedgehog (World).png', name: 'Sonic' },
    { id: 'covers/gba/Metroid Fusion (USA).png', name: 'Samus' },
    { id: 'covers/nes/Mega Man 2 (USA).png', name: 'Mega Man' },
    { id: 'covers/snes/Donkey Kong Country (USA) (Rev 2).png', name: 'Donkey Kong' },
    { id: "covers/snes/Kirby's Dream Land 3 (U).png", name: 'Kirby' }
  ];
  var novoAvatar = '';
  var avatarOptions = document.getElementById('new-avatar-options');
  AVATARES.forEach(function (av) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'new-avatar-option' + (!av.id ? ' none selected' : '');
    b.title = av.name; b.setAttribute('aria-label', av.name);
    if (av.id) { var im = document.createElement('img'); im.src = av.id; im.alt = av.name; b.appendChild(im); }
    else b.textContent = 'RV';
    b.addEventListener('click', function () { novoAvatar = av.id; [].forEach.call(avatarOptions.children, function (x) { x.classList.remove('selected'); }); b.classList.add('selected'); });
    avatarOptions.appendChild(b);
  });

  document.getElementById('form-new').addEventListener('submit', async function (e) {
    e.preventDefault();
    if (!TEM_CONTA) return;
    esconderMensagem(); ocupado(this, true);
    try {
      var p = await RVAccount.createLocalProfile(
        document.getElementById('new-name').value,
        document.getElementById('new-pin').value, novoAvatar);
      concluir(p.name);
    } catch (err) { mostrarMensagem(err.message); ocupado(this, false); }
  });

  /* ── Arranque ── */
  renderPerfis();
  document.getElementById('pane-' + painelAtual).classList.add('active');
  if (painelAtual !== 'entrar') document.getElementById('pane-entrar').classList.remove('active');
  tabs.forEach(function (b) { b.setAttribute('aria-selected', String(b.dataset.pane === painelAtual)); });
  requestAnimationFrame(function () { ajustarAltura(); moverIndicador(); });
  setTimeout(function () { ajustarAltura(); moverIndicador(); }, 350);

  if ('serviceWorker' in navigator) {
    try { navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function () { }); } catch (e) { }
  }
})();
</script>
</body>
</html>
