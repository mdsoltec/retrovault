<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 0%, #051408 0%, #020503 60%);
      color: #d7efe0; font-family: system-ui, -apple-system, sans-serif; text-align: center; padding: 24px;
    }
    .box { max-width: 480px; }
    .code {
      font-family: Orbitron, system-ui, sans-serif; font-weight: 900; font-size: clamp(4rem, 16vw, 7rem);

    a.btn {
      display: inline-block; padding: 13px 30px; border-radius: 12px; text-decoration: none;
      background: #00ff41; color: #02120a; font-weight: 800; letter-spacing: 1.5px;
      font-family: Orbitron, system-ui, sans-serif; font-size: .85rem; text-transform: uppercase;
      box-shadow: 0 8px 30px rgba(0, 255, 65, .25);
    }
    a.btn:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(0, 255, 65, .35); }
    .cartucho {
      width: 130px; margin: 0 auto 18px; opacity: .9; filter: drop-shadow(0 6px 18px rgba(0, 0, 0, .6));
    }
    .scanlines { position: fixed; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0 1px, transparent 1px 3px); }
  </style>
</head>
