<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#020503">
  <link rel="icon" type="image/png" href="assets/rv-icon.png">
  <link rel="manifest" href="manifest.json">
  <title>RetroVault OS — Cartucho não encontrado</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --phosphor: #39ff14;
      --phosphor-deep: #00ff41;
      --phosphor-dim: #0b3d18;
      --amber: #ffb347;
      --amber-hot: #ffd27a;
      --magenta: #ff2bd6;
      --cyan: #5ef2ff;
      --bg-0: #010402;
      --bg-1: #041208;
      --panel: #07140c;
      --text: #d8f6e2;
      --muted: #7fa08a;
      --bezel: #121212;
      --bezel-2: #2a2a2a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      color: var(--text);
      font-family: "Share Tech Mono", ui-monospace, "Cascadia Mono", "Courier New", monospace;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(0, 255, 65, .12), transparent 55%),
        radial-gradient(ellipse 50% 40% at 80% 110%, rgba(255, 43, 214, .08), transparent 50%),
        linear-gradient(180deg, #020805 0%, var(--bg-0) 100%);
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: 18px;
    }

    /* ambient grid */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(0, 255, 65, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 65, .035) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: radial-gradient(ellipse at center, #000 40%, transparent 80%);
      z-index: 0;
    }

    .stage {
      position: relative;
      z-index: 1;
      width: min(720px, 100%);
    }

    /* CRT bezel */
    .crt {
      position: relative;
      background:
        linear-gradient(180deg, #1c1c1c 0%, #0a0a0a 40%, #151515 100%);
      border-radius: 28px;
      padding: 18px 18px 22px;
      box-shadow:
        0 0 0 2px #3a3a3a,
        0 0 0 6px #0d0d0d,
        0 30px 80px rgba(0, 0, 0, .75),
        0 0 80px rgba(0, 255, 65, .08);
    }

    .crt-brand {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 10px 12px;
      color: #8a8a8a;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-family: Orbitron, system-ui, sans-serif;
      font-weight: 700;
    }

    .crt-brand span { color: var(--phosphor-deep); text-shadow: 0 0 8px rgba(0, 255, 65, .6); }

    .screen-wrap {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      background: #020804;
      box-shadow:
        inset 0 0 80px rgba(0, 255, 65, .08),
        inset 0 0 0 2px rgba(0, 255, 65, .18);
    }

    .screen {
      position: relative;
      isolation: isolate;
      min-height: min(78vh, 640px);
      padding: 28px 22px 26px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(8, 40, 16, .55), transparent 50%),
        repeating-linear-gradient(0deg, rgba(0, 0, 0, .12) 0 1px, transparent 1px 3px);
    }

    /* curved glass */
    .glass {
      pointer-events: none;
      position: absolute;
      inset: 0;
      border-radius: 16px;
      background:
        radial-gradient(120% 80% at 50% 120%, rgba(0, 0, 0, .45), transparent 50%),
        linear-gradient(165deg, rgba(255, 255, 255, .08) 0%, transparent 28%, transparent 70%, rgba(0, 0, 0, .25) 100%);
      z-index: 6;
    }

    .scanlines {
      pointer-events: none;
      position: absolute;
      inset: 0;
      z-index: 5;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, .22) 0 1px,
        transparent 1px 3px
      );
      mix-blend-mode: multiply;
      animation: scan-drift 8s linear infinite;
    }

    .sweep {
      pointer-events: none;
      position: absolute;
      left: 0; right: 0;
      height: 28%;
      z-index: 4;
      background: linear-gradient(180deg, transparent, rgba(57, 255, 20, .07), transparent);
      animation: sweep 4.8s ease-in-out infinite;
    }

    @keyframes scan-drift {
      from { background-position: 0 0; }
      to { background-position: 0 12px; }
    }

    @keyframes sweep {
      0% { top: -30%; }
      100% { top: 110%; }
    }

    .hud {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      letter-spacing: 1.5px;
      color: var(--phosphor);
      text-shadow: 0 0 8px rgba(57, 255, 20, .7);
      margin-bottom: 8px;
      opacity: .85;
      z-index: 2;
    }

    .hud .blink { animation: blink 1.2s step-end infinite; }

    @keyframes blink {
      50% { opacity: 0; }
    }

    /* cartridge */
    .cart-wrap {
      position: relative;
      margin: 8px 0 6px;
      z-index: 2;
      cursor: pointer;
      border: 0;
      background: none;
      color: inherit;
    }

    .cart-wrap:focus-visible {
      outline: 2px dashed var(--phosphor);
      outline-offset: 8px;
      border-radius: 8px;
    }

    .cartucho {
      width: 132px;
      height: auto;
      filter: drop-shadow(0 10px 18px rgba(0, 0, 0, .7)) drop-shadow(0 0 12px rgba(0, 255, 65, .25));
      transition: transform .25s ease;
      animation: float 3.4s ease-in-out infinite;
    }

    .cart-wrap:hover .cartucho,
    .cart-wrap:focus-visible .cartucho {
      transform: translateY(-6px) rotate(-2deg);
    }

    .cart-wrap.blow .cartucho {
      animation: shake .45s ease;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    @keyframes shake {
      0%, 100% { transform: translate(0, 0) rotate(0); }
      20% { transform: translate(-6px, 2px) rotate(-4deg); }
      40% { transform: translate(7px, -3px) rotate(3deg); }
      60% { transform: translate(-5px, 1px) rotate(-2deg); }
      80% { transform: translate(4px, -1px) rotate(1deg); }
    }

    .dust {
      position: absolute;
      inset: -10px -20px auto;
      height: 40px;
      pointer-events: none;
      opacity: 0;
    }

    .cart-wrap.blow .dust { animation: dust-puff .7s ease-out forwards; }

    @keyframes dust-puff {
      0% { opacity: .9; transform: translateY(8px) scale(.6); }
      100% { opacity: 0; transform: translateY(-28px) scale(1.4); }
    }

    .hint {
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
      z-index: 2;
    }

    /* pixel 404 */
    .digits {
      display: flex;
      gap: 18px;
      align-items: flex-end;
      justify-content: center;
      margin: 4px 0 14px;
      z-index: 2;
      filter: drop-shadow(0 0 10px rgba(57, 255, 20, .55));
      animation: glitch-shift 4.5s steps(2, end) infinite;
    }

    .digit {
      display: grid;
      grid-template-columns: repeat(4, 14px);
      grid-auto-rows: 14px;
      gap: 3px;
    }

    .digit i {
      display: block;
      background: var(--phosphor);
      box-shadow: 0 0 8px rgba(57, 255, 20, .55);
      border-radius: 1px;
    }

    .digit i.off { background: transparent; box-shadow: none; }

    @keyframes glitch-shift {
      0%, 86%, 100% { transform: none; filter: drop-shadow(0 0 10px rgba(57, 255, 20, .55)); }
      87% { transform: translate(-3px, 1px) skewX(-2deg); filter: drop-shadow(3px 0 0 var(--magenta)) drop-shadow(-3px 0 0 var(--cyan)); }
      89% { transform: translate(4px, -1px); }
      91% { transform: none; }
      93% { transform: translate(-2px, 0) skewX(1deg); filter: drop-shadow(-4px 0 0 var(--magenta)); }
    }

    h1 {
      font-family: "Press Start 2P", Orbitron, ui-monospace, monospace;
      font-size: clamp(10px, 2.4vw, 14px);
      line-height: 1.7;
      letter-spacing: 1px;
      color: var(--amber-hot);
      text-shadow: 0 0 12px rgba(255, 179, 71, .45);
      margin-bottom: 10px;
      z-index: 2;
    }

    .log {
      max-width: 420px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
      margin-bottom: 18px;
      z-index: 2;
      min-height: 3.2em;
    }

    .log .ok { color: var(--phosphor); }
    .log .err { color: #ff6b6b; }
    .log .warn { color: var(--amber); }

    .continue {
      z-index: 2;
      margin: 4px 0 16px;
    }

    .continue-label {
      font-family: "Press Start 2P", Orbitron, monospace;
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--text);
      margin-bottom: 8px;
      animation: pulse 1.1s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .35; }
    }

    .timer {
      font-family: "Press Start 2P", Orbitron, monospace;
      font-size: 28px;
      color: var(--phosphor);
      text-shadow: 0 0 16px rgba(57, 255, 20, .7);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      z-index: 2;
      margin-top: auto;
    }

    a.btn, button.ghost {
      font-family: Orbitron, system-ui, sans-serif;
      font-weight: 800;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 10px;
      padding: 13px 22px;
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }

    a.btn {
      background: var(--phosphor-deep);
      color: #02120a;
      box-shadow: 0 8px 28px rgba(0, 255, 65, .28), inset 0 -3px 0 rgba(0, 0, 0, .2);
    }

    a.btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 36px rgba(0, 255, 65, .4);
    }

    button.ghost {
      background: transparent;
      color: var(--phosphor);
      border: 1px solid rgba(0, 255, 65, .45);
    }

    button.ghost:hover {
      background: rgba(0, 255, 65, .08);
      transform: translateY(-2px);
    }

    .footer-led {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding-top: 12px;
    }

    .led {
      width: 8px; height: 8px; border-radius: 50%;
      background: #222;
      box-shadow: inset 0 1px 2px #000;
    }

    .led.on {
      background: var(--phosphor-deep);
      box-shadow: 0 0 10px var(--phosphor);
      animation: blink 1.6s step-end infinite;
    }

    .led.amber {
      background: var(--amber);
      box-shadow: 0 0 10px var(--amber);
    }

    .toast {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: rgba(2, 12, 6, .92);
      border: 1px solid rgba(0, 255, 65, .4);
      color: var(--phosphor);
      font-size: 11px;
      letter-spacing: 1px;
      padding: 8px 12px;
      border-radius: 8px;
      opacity: 0;
      pointer-events: none;
      z-index: 8;
      white-space: nowrap;
    }

    .toast.show {
      animation: toast-in .7s ease forwards;
    }

    @keyframes toast-in {
      0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
      20% { opacity: 1; transform: translateX(-50%) translateY(0); }
      80% { opacity: 1; }
      100% { opacity: 0; transform: translateX(-50%) translateY(-6px); }
    }

    /* particles */
    .bits {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 1;
      pointer-events: none;
    }

    .bit {
      position: absolute;
      width: 4px; height: 4px;
      background: var(--phosphor);
      opacity: .35;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% { transform: translateY(-10px); opacity: 0; }
      10% { opacity: .4; }
      100% { transform: translateY(110vh); opacity: 0; }
    }

    @media (max-width: 520px) {
      .digit { grid-template-columns: repeat(4, 11px); grid-auto-rows: 11px; gap: 2px; }
      .digits { gap: 12px; }
      .screen { min-height: min(82vh, 620px); padding: 20px 14px 18px; }
      .log { font-size: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <div class="stage">
    <div class="crt">
      <div class="crt-brand">
        <div>RV-OS <span>CRT-404</span></div>
        <div>NTSC · 60Hz</div>
      </div>

      <div class="screen-wrap">
        <div class="bits" id="bits" aria-hidden="true"></div>
        <div class="screen">
          <div class="hud">
            <span>PLAYER 1</span>
            <span class="blink">● SINAL PERDIDO</span>
            <span>SCORE 000404</span>
          </div>

          <button class="cart-wrap" id="cart" type="button" aria-label="Soprar o cartucho">
            <svg class="dust" viewBox="0 0 160 40" aria-hidden="true">
              <circle cx="30" cy="22" r="2" fill="#c8e6c9" />
              <circle cx="52" cy="14" r="1.6" fill="#a5d6a7" />
              <circle cx="78" cy="20" r="2.2" fill="#dcedc8" />
              <circle cx="104" cy="12" r="1.4" fill="#c8e6c9" />
              <circle cx="128" cy="24" r="1.8" fill="#a5d6a7" />
            </svg>
            <svg class="cartucho" viewBox="0 0 120 140" fill="none" aria-hidden="true">
              <path d="M18 8h84a10 10 0 0 1 10 10v114H8V18A10 10 0 0 1 18 8z" fill="#08180e" stroke="#39ff14" stroke-width="3" />
              <path d="M8 118h104v18H8z" fill="#0c2414" stroke="#39ff14" stroke-width="3" />
              <rect x="26" y="22" width="68" height="40" rx="4" fill="#041209" stroke="#39ff14" stroke-width="2" />
              <text x="60" y="48" text-anchor="middle" font-family="Orbitron, monospace" font-size="18" font-weight="900" fill="#39ff14">?</text>
              <rect x="34" y="72" width="52" height="8" rx="1" fill="#12321c" />
              <rect x="34" y="86" width="52" height="8" rx="1" fill="#12321c" />
              <rect x="40" y="122" width="40" height="6" rx="1" fill="#39ff14" opacity=".45" />
            </svg>
          </button>
          <p class="hint">clique no cartucho · sopre a poeira</p>

          <div class="digits" aria-hidden="true">
            <!-- 4 -->
            <div class="digit">
              <i></i><i class="off"></i><i class="off"></i><i></i>
              <i></i><i class="off"></i><i class="off"></i><i></i>
              <i></i><i></i><i></i><i></i>
              <i class="off"></i><i class="off"></i><i class="off"></i><i></i>
              <i class="off"></i><i class="off"></i><i class="off"></i><i></i>
            </div>
            <!-- 0 -->
            <div class="digit">
              <i></i><i></i><i></i><i></i>
              <i></i><i class="off"></i><i class="off"></i><i></i>
              <i></i><i class="off"></i><i class="off"></i><i></i>
              <i></i><i class="off"></i><i class="off"></i><i></i>
              <i></i><i></i><i></i><i></i>
            </div>
            <!-- 4 -->
            <div class="digit">
              <i></i><i class="off"></i><i class="off"></i><i></i>
              <i></i><i class="off"></i><i class="off"></i><i></i>
              <i></i><i></i><i></i><i></i>
              <i class="off"></i><i class="off"></i><i class="off"></i><i></i>
              <i class="off"></i><i class="off"></i><i class="off"></i><i></i>
            </div>
          </div>

          <h1>CARTUCHO NÃO ENCONTRADO</h1>
          <p class="log" id="log" aria-live="polite"></p>

          <div class="continue">
            <div class="continue-label">CONTINUE?</div>
            <div class="timer" id="timer">9</div>
          </div>

          <div class="actions">
            <a class="btn" href="index.html" id="start">▶ START - VOLTAR</a>
            <button class="ghost" type="button" id="retry">TENTAR NOVAMENTE</button>
          </div>

          <div class="toast" id="toast" role="status"></div>
        </div>
        <div class="sweep" aria-hidden="true"></div>
        <div class="scanlines" aria-hidden="true"></div>
        <div class="glass" aria-hidden="true"></div>
      </div>

      <div class="footer-led" aria-hidden="true">
        <span class="led on"></span>
        <span class="led amber"></span>
        <span class="led"></span>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const lines = [
        { t: "> boot RetroVault OS 2.0 …", c: "ok" },
        { t: "> mount /roms … ok", c: "ok" },
        { t: "> checksum cart.bin … FAIL", c: "err" },
        { t: "> soprar o cartucho não restaurou o setor.", c: "warn" },
        { t: "> o cofre dos clássicos está intacto. volte ao lobby.", c: "" }
      ];

      const logEl = document.getElementById("log");
      let i = 0;
      function typeNext() {
        if (i >= lines.length) return;
        const row = document.createElement("div");
        if (lines[i].c) row.className = lines[i].c;
        logEl.appendChild(row);
        const text = lines[i].t;
        let k = 0;
        const tick = setInterval(function () {
          k += 1;
          row.textContent = text.slice(0, k);
          if (k >= text.length) {
            clearInterval(tick);
            i += 1;
            setTimeout(typeNext, 220);
          }
        }, 16);
      }
      typeNext();

      const timerEl = document.getElementById("timer");
      let n = 9;
      const clock = setInterval(function () {
        n -= 1;
        if (n < 0) n = 9;
        timerEl.textContent = String(n);
      }, 1000);

      const cart = document.getElementById("cart");
      const toast = document.getElementById("toast");
      const blows = [
        "poeira limpa. o cartucho ainda está vazio.",
        "você soprou. o CRC continua 0x000404.",
        "tente de novo… ou pressione START.",
        "clássico ritual. infelizmente esta ROM não existe."
      ];
      let b = 0;
      function puff() {
        cart.classList.remove("blow");
        void cart.offsetWidth;
        cart.classList.add("blow");
        toast.textContent = blows[b % blows.length];
        b += 1;
        toast.classList.remove("show");
        void toast.offsetWidth;
        toast.classList.add("show");
      }
      cart.addEventListener("click", puff);
      document.getElementById("retry").addEventListener("click", puff);

      const bits = document.getElementById("bits");
      for (let p = 0; p < 22; p++) {
        const el = document.createElement("span");
        el.className = "bit";
        el.style.left = Math.random() * 100 + "%";
        el.style.animationDuration = 6 + Math.random() * 8 + "s";
        el.style.animationDelay = Math.random() * 8 + "s";
        el.style.opacity = String(0.15 + Math.random() * 0.35);
        bits.appendChild(el);
      }

      window.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key.toLowerCase() === "s") {
          window.location.href = "index.html";
        }
      });
    })();
  </script>
</body>

</html>
