  <!-- BARRA DE BUSCA + FILTROS (fixa abaixo da navbar) -->
  <div class="games-toolbar">
    <div class="search-box">
      <input type="text" id="game-search" placeholder="BUSCAR JOGO..." autocomplete="off" spellcheck="false" aria-label="Buscar jogo" onkeyup="filterGames()">
    </div>
    <div class="games-filter-row">
    <span class="games-filter-label">Filtrar jogos por:</span>
    <div class="games-filters" role="tablist" aria-label="Ordenar jogos">
      <button class="filter-btn active" data-sort="default" onclick="sortGames('default', this)">Padrão</button>
      <button class="filter-btn" data-sort="az" onclick="sortGames('az', this)">A-Z</button>
      <button class="filter-btn" data-sort="za" onclick="sortGames('za', this)">Z-A</button>
      <button class="filter-btn filter-fav-btn" data-sort="fav" onclick="sortGames('fav', this)"><img class="rv-inline-icon" src="assets/icons/heart.svg" alt=""> Favoritos</button>
      <button class="filter-btn rvx-dice" data-sort="dice" title="Abrir um jogo aleatório deste console" onclick="RVX.goToRandomGame(consoleType)"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.4" fill="currentColor" stroke="none"/><circle cx="15.5" cy="8.5" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="8.5" cy="15.5" r="1.4" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1.4" fill="currentColor" stroke="none"/></svg> Surpresa</button>
    </div>
    <div class="games-filters" role="group" aria-label="Filtrar por status, gênero e jogadores">
      <select class="rvx-filter-select" id="rvx-f-status" aria-label="Status do jogo" onchange="filterGames()">
        <option value="">Status: todos</option>
        <option value="playing">Jogando</option>
        <option value="done">Zerados</option>
        <option value="wish">Quero zerar</option>
      </select>
      <select class="rvx-filter-select" id="rvx-f-gen" aria-label="Gênero" onchange="filterGames()"></select>
      <select class="rvx-filter-select" id="rvx-f-jog" aria-label="Jogadores" onchange="filterGames()">
        <option value="">Jogadores: todos</option>
        <option value="1">1 jogador</option>
        <option value="2">2+ jogadores</option>
        <option value="4">3–4 jogadores</option>
      </select>
      <select class="rvx-filter-select" id="rvx-f-col" aria-label="Coleção" onchange="filterGames()"></select>
    </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    let consoleType = params.get('console') || 'snes';

    const config = {
      'snes': { title: 'Super Nintendo', core: 'snes' },
      'nes': { title: 'Nintendo Classic', core: 'nes' },
      'gba': { title: 'Game Boy Advance', core: 'gba' },
      'gbc': { title: 'Game Boy Color', core: 'gbc' },
      'sega': { title: 'Mega Drive', core: 'segaMD' },
      'arcade': { title: 'Arcade / Fliperama', core: 'fbneo' },
      'n64': { title: 'Nintendo 64', core: 'n64' },
      'psx': { title: 'PlayStation 1', core: 'pcsx_rearmed' },
      'nds': { title: 'Nintendo DS', core: 'nds' },
      'segacd': { title: 'Sega CD', core: 'segaCD' },
      'gamegear': { title: 'Game Gear', core: 'segaGG' },
      'mastersystem': { title: 'Master System', core: 'segaMS' },
      'atari2600': { title: 'Atari 2600', core: 'atari2600' }
    };

    // Consoles sem catálogo (ou parâmetro inválido) caem no padrão —
    // antes ?console=gb/psp mostrava a página vazia "0 JOGOS DISPONÍVEIS".
    if (!config[consoleType]) consoleType = 'snes';
    const currentConfig = config[consoleType];
    document.getElementById('console-title').innerText = currentConfig.title;
    document.title = 'RetroVault OS - ' + currentConfig.title;

    // ─────────────────────────────────────────────────────────
    // SISTEMA DE CAPAS AUTOMÁTICO → js/covers.js (RVCovers)
    // 1) covers/<console>/<rom>.png|.jpg  (local)
    // 2) se não existir, busca sozinho na web (libretro-thumbnails:
    //    Named_Boxarts → Named_Covers → Named_Titles, testando
    //    variações do nome) e memoriza o resultado em cache.
    // 3) se nada existir, mostra o placeholder "RV".
    // ─────────────────────────────────────────────────────────

    // BANCO DE DADOS DOS JOGOS — fonte única: js/catalog.js (CATALOG).
    const catalog = {};
    for (const k of Object.keys(window.CATALOG || {})) catalog[k] = window.CATALOG[k].games || [];

    const container = document.getElementById('games-list');
    const games = catalog[consoleType] || [];

    // ═══ FAVORITOS (localStorage) ═══
    function getFavorites() {
      try { return JSON.parse(RVStore.getItem('rv_favorites') || '[]'); } catch { return []; }
    }

    function isFavorite(gameFile) {
      return getFavorites().some(f => f.file === gameFile && f.console === consoleType);
    }

    function toggleFavorite(game) {
      let favs = getFavorites();
      const idx = favs.findIndex(f => f.file === game.file && f.console === consoleType);
      if (idx >= 0) {
        favs.splice(idx, 1);
      } else {
        const consoleShorts = { snes: 'SNES', nes: 'NES', gba: 'GBA', gbc: 'GBC', n64: 'N64', psx: 'PS1', sega: 'SEGA', segacd: 'MEGA CD', gamegear: 'GG', mastersystem: 'SMS', atari2600: 'ATARI', nds: 'NDS', arcade: 'ARCADE' };
        favs.unshift({
          name: game.name,
          subtitle: game.subtitle || '',
          file: game.file,
          core: currentConfig.core,
          console: consoleType,
          consoleShort: consoleShorts[consoleType] || consoleType.toUpperCase()
        });
      }
      RVStore.setItem('rv_favorites', JSON.stringify(favs));
      renderGames(getCurrentList());
    }

    // ═══ FILTROS / ORDENAÇÃO ═══
    let currentSort = 'default';
    let colecaoAtiva = params.get('colecao') || '';

    /* Preenche os selects de gênero e coleção com o que EXISTE neste console.
       Roda no load: fichas.js entra DEPOIS deste bloco na página. */
    function initRvxFilters() {
      const fichas = window.RV_FICHAS || {};
      const gens = new Set();
      games.forEach(g => { const f = fichas[g.file]; if (f && f.gen) gens.add(f.gen); });
      const selGen = document.getElementById('rvx-f-gen');
      if (selGen) {
        selGen.innerHTML = '<option value="">Gênero: todos</option>' +
          [...gens].sort((a, b) => a.localeCompare(b, 'pt-BR')).map(g => `<option value="${g}">${g}</option>`).join('');
      }
      const selCol = document.getElementById('rvx-f-col');
      if (selCol && window.RVX) {
        const cols = RVX.COLLECTIONS.filter(c => RVX.collectionGames(c.id, consoleType).length > 0);
        selCol.innerHTML = '<option value="">Coleção: todas</option>' +
          cols.map(c => `<option value="${c.id}">${c.name} (${RVX.collectionGames(c.id, consoleType).length})</option>`).join('');
        if (colecaoAtiva) { selCol.value = colecaoAtiva; renderGames(getCurrentList()); }
      }
    }
    if (document.readyState === 'complete') initRvxFilters();
    else window.addEventListener('load', initRvxFilters);

    function getCurrentList() {
      const query = document.getElementById('game-search').value.trim().toLowerCase();
      const fStatus = (document.getElementById('rvx-f-status') || {}).value || '';
      const fGen = (document.getElementById('rvx-f-gen') || {}).value || '';
      const fJog = (document.getElementById('rvx-f-jog') || {}).value || '';
      const fCol = (document.getElementById('rvx-f-col') || {}).value || colecaoAtiva;
      const fichas = window.RV_FICHAS || {};
      let list = games;
      if (query) {
        list = games.filter(g => g.name.toLowerCase().includes(query) || (g.subtitle && g.subtitle.toLowerCase().includes(query)));
      }
      if (fStatus && window.RVX) {
        list = list.filter(g => RVX.statusOf(RVX.gameKey(consoleType, g.file)) === fStatus);
      }
      if (fGen) list = list.filter(g => fichas[g.file] && fichas[g.file].gen === fGen);
      if (fJog) {
        const n = Number(fJog);
        list = list.filter(g => fichas[g.file] && Number(fichas[g.file].jog) >= (n >= 4 ? 3 : n));
      }
      if (fCol && window.RVX) {
        const permitidos = new Set(RVX.collectionGames(fCol, consoleType));
        list = list.filter(g => permitidos.has(g.file));
      }
      if (currentSort === 'az') {
        list = [...list].sort((a, b) => a.name.localeCompare(b.name));
      } else if (currentSort === 'za') {
        list = [...list].sort((a, b) => b.name.localeCompare(a.name));
      } else if (currentSort === 'fav') {
        const favs = getFavorites();
        list = list.filter(g => favs.some(f => f.file === g.file && f.console === consoleType));
      }
      return list;
    }

    function sortGames(sort, btn) {
      currentSort = sort;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderGames(getCurrentList());
    }

    // Atualiza badge de quantidade
    function updateCountBadge(count) {
      const badge = document.getElementById('games-count');
      badge.innerText = count + (count === 1 ? ' JOGO DISPONÍVEL' : ' JOGOS DISPONÍVEIS');
    }
    updateCountBadge(games.length);



    function renderGames(list) {
      container.innerHTML = '';
      if (list.length === 0) {
        container.innerHTML = '<p class="empty-msg">Nenhum jogo encontrado.</p>';
        updateCountBadge(0);
        return;
      }
      updateCountBadge(list.length);

      list.forEach(game => {
        const card = document.createElement('a');
        card.className = 'game-card';
        card.href = `play.html?core=${currentConfig.core}&game=${consoleType}/${encodeURIComponent(game.file)}`;

        // Capa dentro do wrapper proporcional
        const coverWrap = document.createElement('div');
        coverWrap.className = 'game-cover-wrap';
        coverWrap.style.position = 'relative';

        const img = document.createElement('img');
        img.alt = game.name;
        img.className = 'game-cover-img';
        img.loading = 'lazy';

        // Placeholder "RV" só depois de esgotar TODAS as fontes (local + web)
        const showFallback = () => {
          const icon = document.createElement('div');
          icon.className = 'game-icon rv-fallback';
          icon.innerHTML = '<span class="rv-fallback-text">RV</span>';
          if (coverWrap.parentNode) coverWrap.replaceWith(icon);
        };

        // Sistema automático de capas: se não existir localmente,
        // baixa da base libretro-thumbnails (js/covers.js)
        RVCovers.attach(img, {
          console: consoleType,
          file: game.file,
          remote: game.remote,
          name: game.name,
          subtitle: game.subtitle,
          onFail: showFallback,
          onLoad: (url) => {
            coverWrap.style.setProperty('--cover-bg', `url('${url}')`);
            coverWrap.style.setProperty('--cover-loaded', '1');
            let bgEl = coverWrap.querySelector('.cover-blur-bg');
            if (!bgEl) {
              bgEl = document.createElement('div');
              bgEl.className = 'cover-blur-bg';
              coverWrap.insertBefore(bgEl, img);
            }
            bgEl.style.backgroundImage = `url('${url}')`;
          }
        });

        coverWrap.appendChild(img);

        // Selo "JOGAR ▶" do hover: elemento real com flex (centralizado exato,
        // sem depender de posição chutada de background).
        const cta = document.createElement('span');
        cta.className = 'game-cover-cta';
        cta.setAttribute('aria-hidden', 'true');
        cta.innerHTML = '<span class="game-cover-cta-text">JOGAR</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
        coverWrap.appendChild(cta);

        // Botão de favorito
        const favBtn = document.createElement('button');
        favBtn.className = 'fav-btn' + (isFavorite(game.file) ? ' active' : '');
        favBtn.innerHTML = '<img src="assets/icons/' + (isFavorite(game.file) ? 'heart-red.svg' : 'heart.svg') + '" alt="Favoritar" width="15" height="15">';
        favBtn.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          toggleFavorite(game);
        });
        coverWrap.appendChild(favBtn);

        // Selo de status (jogando / zerado / quero zerar) — toques ciclam
        if (window.RVX) {
          const stBtn = document.createElement('button');
          stBtn.type = 'button';
          stBtn.className = 'rvx-status-btn';
          const paintStatus = () => {
            const s = RVX.statusOf(RVX.gameKey(consoleType, game.file));
            stBtn.classList.remove('s-playing', 's-done', 's-wish');
            if (s) stBtn.classList.add('s-' + s);
            const ICO = {
              playing: '<polygon points="8 5 19 12 8 19" fill="currentColor" stroke="none"/>',
              done: '<polyline points="20 6 9 17 4 12"/>',
              wish: '<polygon points="12 3 14.7 8.6 20.9 9.4 16.4 13.7 17.5 19.9 12 17 6.5 19.9 7.6 13.7 3.1 9.4 9.3 8.6 12 3"/>',
              none: '<circle cx="12" cy="12" r="8"/>'
            };
            stBtn.innerHTML = '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (s ? ICO[s] : ICO.none) + '</svg>';
            stBtn.title = s ? 'Status: ' + RVX.STATUS_LABEL[s] + ' (toque para mudar)' : 'Marcar status (jogando / zerado / quero zerar)';
            stBtn.setAttribute('aria-label', stBtn.title);
          };
          paintStatus();
          stBtn.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();
            RVX.cycleStatus(RVX.gameKey(consoleType, game.file));
            paintStatus();
          });
          coverWrap.appendChild(stBtn);
        }

        // Bloco de Informações
        const gameInfo = document.createElement('div');
        gameInfo.className = 'game-info';
        gameInfo.innerHTML = `
          <h3>${game.name}</h3>
          <span class="game-subtitle">${game.subtitle || ''}</span>
        `;

        card.appendChild(coverWrap);
        card.appendChild(gameInfo);
        container.appendChild(card);
      });
    }

    function filterGames() {
      renderGames(getCurrentList());
    }

    renderGames(games);

    /* Register Service Worker (PWA) — sw.js na raiz, escopo cobre todo o app */
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js', { scope: './' }).catch(() => { });
    }
  </script>
